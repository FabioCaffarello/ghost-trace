# Prometheus scrape config for the observability profile.
#
# Every service exposes one registry at /metrics (libs/metrics): the
# route-labelled HTTP counters and duration histogram that libs/middleware
# registers, plus the domain counters each service adds. Only the
# collector is scraped here — the others are worth adding when they have
# domain series worth reading.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ghost-trace
    static_configs:
      - targets: ["collector:8080"]
