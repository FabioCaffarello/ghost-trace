# .github/ISSUE_TEMPLATE/config.yml
#
# Per CONTRIBUTING.md, contribution is gated through the four mandatory
# reads and the three accepted contribution classes. Blank issues are
# disabled to force template selection; the templates surface the
# project's discipline before the issue is opened.

blank_issues_enabled: false

contact_links:
  - name: Discussion (philosophical questions about the Charter)
    url: https://github.com/FabioCaffarello/ghost-trace/discussions
    about: For open-ended discussion of the Charter, the Ontology, or the project's discipline — not for bug reports or RFC proposals.
  - name: Read CONTRIBUTING.md first
    url: https://github.com/FabioCaffarello/ghost-trace/blob/main/CONTRIBUTING.md
    about: Before opening an issue, read the four mandatory documents listed at the top of CONTRIBUTING.md.
