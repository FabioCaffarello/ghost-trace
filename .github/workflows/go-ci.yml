# Go CI — schema checks + build + test for the Ghost Trace tree.
#
# Generated code is COMMITTED under libs/genproto; the genproto-sync step
# regenerates and fails on any diff, so the schemas and the committed
# bindings cannot drift. buf lint and breaking-change detection guard the
# wire contract itself (§2, §7).
#
# The v1 workflow made every step conditional on a `hashFiles` probe for
# services/ingestion/Makefile — which M0 deleted — so restoring it unchanged
# would have skipped all steps and reported a vacuous green on a required
# status check. These steps are unconditional: if the service does not
# build, the check fails.

name: go-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schemas:
    name: schemas — lint + breaking + genproto sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/ingestion/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.68.4'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: make -C services/ingestion tools

      - name: buf lint
        run: buf lint

      # subdir=schemas pins the against-input root so the comparison
      # aligns with refs that predate buf.yaml (module root = schemas/).
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }},subdir=schemas"

      # Delete-then-regenerate so orphaned bindings from removed protos
      # surface as deletions. The porcelain check (unlike `git diff
      # --exit-code`, which only sees tracked files — the old vacuous
      # green) also fails on a NEW proto whose generated .pb.go was
      # never committed.
      - name: genproto in sync
        run: |
          find libs/genproto -name '*.pb.go' -delete
          PATH="$(go env GOPATH)/bin:$PATH" buf generate
          if [ -n "$(git status --porcelain -- libs/genproto)" ]; then
            git status --porcelain -- libs/genproto
            echo "::error::libs/genproto is out of sync — run 'buf generate' and commit the result"
            exit 1
          fi

  ingestion:
    name: services/ingestion — build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/ingestion/go.sum

      - name: Build
        run: make build

      - name: Test (-race)
        run: make test

      - name: Vet
        run: make vet
