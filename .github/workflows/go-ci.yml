# Go CI — build + test for the Ghost Trace service tree.
#
# internal/genproto is generated, not tracked, so `make generate` must run
# before build or test on a fresh checkout.
#
# The v1 workflow made every step conditional on a `hashFiles` probe for
# services/ingestion/Makefile — which M0 deleted — so restoring it unchanged
# would have skipped all steps and reported a vacuous green on a required
# status check. These steps are unconditional: if the service does not
# build, the check fails.

name: go-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ingestion:
    name: services/ingestion — build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/ingestion/go.sum

      - uses: arduino/setup-protoc@v3
        with:
          version: '27.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: make tools

      - name: Generate protobuf bindings
        run: make generate

      - name: Build
        run: make build

      - name: Test (-race)
        run: make test

      - name: Vet
        run: make vet
