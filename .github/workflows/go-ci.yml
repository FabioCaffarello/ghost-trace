# Go CI — Ghost Trace services
#
# Governance source: .claude/CLAUDE.md §5.6 (CI scope is bounded) and
# §6.4 (implementation gate cleared at decision-log §0022).
#
# Per-service build + test for the Ghost Trace service tree. Each service
# under services/ owns its own go.mod and its own Makefile contract
# (`make tools && make generate && make test && make build`). This
# workflow invokes that contract; it does not reinvent it.
#
# Path filter intentionally absent at the workflow level: same rationale
# as constitutional-check.yml — required status checks must be reachable
# on every PR. Each service job is guarded by a `hashFiles` check on its
# Makefile so the workflow merges cleanly to main before any service
# exists on main, and so removing a service does not require editing CI.
#
# When this workflow disagrees with `make test` run locally, the local
# Makefile is the source of truth — CI runs the same Makefile.

name: go-ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ingestion:
    name: services/ingestion — build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4

      - name: Detect service presence
        id: detect
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f services/ingestion/Makefile ] && [ -f services/ingestion/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=services/ingestion absent::Skipping build+test; service does not exist on this ref yet."
          fi

      - uses: actions/setup-go@v5
        if: steps.detect.outputs.present == 'true'
        with:
          go-version: '1.22'
          cache-dependency-path: services/ingestion/go.sum

      - uses: arduino/setup-protoc@v3
        if: steps.detect.outputs.present == 'true'
        with:
          version: '27.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build tools (protoc-gen-go)
        if: steps.detect.outputs.present == 'true'
        run: make tools

      - name: Generate protobuf bindings
        if: steps.detect.outputs.present == 'true'
        run: make generate

      - name: Test (-race)
        if: steps.detect.outputs.present == 'true'
        run: make test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: make build
