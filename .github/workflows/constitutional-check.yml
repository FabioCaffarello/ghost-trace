# Constitutional check — Ghost Trace
#
# Governance source: .claude/CLAUDE.md §5.6 (CI scope is bounded).
# Three jobs run on PRs touching *.md files. All three are mechanical:
# grep, anchor extraction, list comparison. No NLP, no judgment.
#
# Explicitly out of scope (per CLAUDE.md §5.6):
#   - RFC template compliance check (premature; no RFC exists yet)
#   - Markdown link health (generic hygiene, not constitutional)
#   - Mechanized falsifiability (requires judgment; lives in the
#     epistemic-auditor subagent with a human in the loop)
#
# When this workflow disagrees with the git pre-commit hook, the git
# hook wins per CLAUDE.md §5.2. CI is redundancy, not source of truth.

name: constitutional-check

on:
  pull_request:
    paths:
      - '**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  doc-check:
    # Runs the same pre-commit-doc-check.sh script that the local git
    # pre-commit hook runs. Self-test first (a malformed watchlist
    # fails CI before the diff check even starts), then the diff
    # check via "git reset --soft" against the base branch (which
    # restages all PR changes so "git diff --cached" sees them).
    name: Documentation discipline (hook script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hook self-test (parsers and source files)
        run: .claude/hooks/pre-commit-doc-check.sh --self-test
      - name: Restage PR changes against base
        # git reset --soft moves HEAD to base while keeping the working
        # tree and index at PR head. This makes the PR's changes
        # appear as "staged" to the hook script, which uses
        # `git diff --cached` to discover what to check.
        run: git reset --soft origin/${{ github.base_ref }}
      - name: Run doc-check
        id: hook
        run: |
          set +e
          output=$(.claude/hooks/pre-commit-doc-check.sh 2>&1)
          exit_code=$?
          {
            echo "exit_code=$exit_code"
            echo "output<<HOOK_EOF"
            echo "$output"
            echo "HOOK_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$output"
          exit $exit_code
      - name: Post findings as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          HOOK_OUTPUT: ${{ steps.hook.outputs.output }}
          HOOK_EXIT: ${{ steps.hook.outputs.exit_code }}
        with:
          script: |
            const exit_code = process.env.HOOK_EXIT || '?';
            const output = process.env.HOOK_OUTPUT || '(no output captured)';
            const passed = exit_code === '0';
            const header = passed
              ? '### doc-check: PASS\n\nNo findings.'
              : `### doc-check: BLOCK (exit ${exit_code})\n\nThe pre-commit doc-check script reports findings below. The local git pre-commit hook would reject this commit; the same applies on merge.\n`;
            const body = `${header}\n\n<details><summary>Script output</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  subordination-check:
    # Mechanical cross-reference check. For each *.md file changed in
    # the PR that lives under docs/ontology/, docs/architecture/,
    # docs/rfcs/, schemas/, or services/: every reference to
    # docs/charter/constitutional-charter.md#<anchor> must resolve to
    # an actual heading in the Charter. Broken anchors fail the job.
    #
    # This is the mechanical complement to the semantic check in the
    # subordination-checker skill. The skill catches contradictions
    # between lower and higher documents; this job catches dangling
    # pointers to Charter sections.
    name: Charter cross-reference validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Charter cross-references
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/check_subordination.py

  glossary-coverage:
    # For each term in .claude/CLAUDE.md §3 (canonical vocabulary), verify
    # the term has an entry in docs/glossary.md, and that the entry
    # carries the four provenance fields: Canonical definition,
    # Introduction, Stabilization, Last amendment. Fields may be filled
    # or marked `pending`, but they must be present.
    #
    # Fail-closed: a parse failure of either source fails the job.
    name: Glossary coverage of canonical vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every canonical term has a complete glossary entry
        run: python3 .github/scripts/check_glossary_coverage.py
