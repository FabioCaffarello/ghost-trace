# Ghost Trace — releases.
#
# R1.13 adopted Conventional Commits explicitly so that a release could
# be derived from them, and then nothing was ever written to do it. This
# is that, and it is deliberately small: scripts/next-release.py reads
# the version and the changelog out of the log, using the SAME header
# rule the commit hook and the pull request check use.
#
# It tags and writes a release. It does not publish images — that was
# refused in R1.12 for want of a consumer, and nothing has changed.
name: release

on:
  push:
    branches: [main]

# Only the tag and the release. Nothing here needs more.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release — tag + changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history and tags: the version is derived from both, and a
      # shallow clone would silently see no previous release and try to
      # cut the first one again.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out what releases
        id: plan
        run: |
          plan=$(python3 scripts/next-release.py --json)
          echo "$plan" | python3 -m json.tool
          version=$(echo "$plan" | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"] or "")')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$plan" | python3 -c 'import sys,json;print(json.load(sys.stdin)["changelog"])' > /tmp/changelog.md

      - name: Nothing to release
        if: steps.plan.outputs.version == ''
        run: echo "no feat, fix or perf since the last release; nothing to cut"

      # Idempotent by construction: a tag that already exists means this
      # commit was already released, which happens whenever the workflow
      # is re-run.
      - name: Tag and release
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION already exists; nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --notes-file /tmp/changelog.md
