# Ghost Trace — the quality gate.
#
# Every step is `make <target>`. This file decides WHEN things run and
# on what machine; the root Makefile decides WHAT they do. That split is
# the point: `make ci` locally and a green run here are the same
# statement, and a gate cannot be strengthened in one place and quietly
# left behind in the other.
#
# Actions are pinned by commit SHA with the tag in a trailing comment. A
# tag is mutable — `@v7` is a promise from a third party that today's
# code is what runs tomorrow, and that promise is exactly what supply
# chain attacks break. Dependabot proposes the SHA bumps.
#
# The v1 workflow made every step conditional on a `hashFiles` probe for
# a file that had been deleted, so all steps skipped and a vacuous green
# was reported on a required status check. Nothing here is conditional
# on a file existing: if it does not build, the check fails.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded run on a branch is wasted compute. On main every commit
# is a state someone may ship from, so those runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The job name is a required status check on main. It now also gates
  # the HTTP contract, but renaming it to say so would silently remove
  # the protection, so the name stays and this comment carries the news.
  schemas:
    name: schemas — lint + breaking + genproto sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares against the base branch

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from the module rather than restated here: a CI Go
          # version that can drift from go.mod is a defect waiting for
          # the day the two disagree.
          go-version-file: services/collector/go.mod
          cache-dependency-path: |
            services/collector/go.sum
            libs/genproto/go.sum

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.68.4' # keep in step with BUF_VER in the Makefile
          # Raises the API rate limit while resolving the release. The
          # workflow token is read-only (permissions, above).
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: make buf-lint

      - name: buf breaking (against the base branch)
        if: github.event_name == 'pull_request'
        run: make buf-breaking BASE_REF=${{ github.base_ref }}

      - name: genproto in sync
        run: make genproto-sync

      # The published HTTP contract is generated from the Go wire types.
      # Committing it and failing on drift is what stops it becoming a
      # description of last quarter's API; the lint is a curated ruleset
      # (.vacuum.yaml) that already caught a schema demanding every
      # field of a discriminated union.
      - name: openapi in sync
        run: make openapi-sync

      - name: openapi lint
        run: make openapi-lint

      # The harness's request fixtures are emitted by its wire modules,
      # so this also catches the two halves of the harness disagreeing
      # about the wire — which no server-side test would show.
      - name: contract fixtures in sync
        run: make contract-fixtures-sync

      # CLAUDE.md is a generated export of .context/, which is the
      # versioned source of what an agent picking this up cold is told.
      # Same discipline as every other generated artifact here.
      - name: agent context in sync
        run: make context-sync-check

  # The job name is a required status check on main. Renaming it silently
  # removes the protection, so it stays as it is — even though this job
  # now covers every module in the workspace rather than one service.
  collector:
    name: services/collector — build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/collector/go.mod
          cache-dependency-path: |
            services/collector/go.sum
            libs/genproto/go.sum

      - name: Format
        run: make fmt-check

      - name: Modules tidy
        run: make tidy-check

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test (-race)
        run: make test-race

      - name: Coverage
        run: make coverage

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: .coverage/coverage.out
          retention-days: 14

  # Each module must ALSO build and test standalone, with the workspace
  # switched off (GOWORK=off). That is how the container builds them,
  # and a module that only compiles inside the workspace has a `replace`
  # or a require missing — which is exactly what broke the image build
  # the first time libs/middleware was extracted.
  modules:
    name: modules — standalone build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/archive
          - libs/canonical
          - libs/decision
          - libs/eventstream
          - libs/feature
          - libs/genproto
          - libs/id
          - libs/metrics
          - libs/middleware
          - libs/policy
          - libs/snapshot
          - libs/substrate
          - libs/tenant
          - libs/wire
          - services/archive
          - services/decision-engine
          - services/demo-web
          - services/collector
          - tools/loadgen
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Build
        run: go build ./...
        working-directory: ${{ matrix.module }}

      - name: Test
        run: go test ./...
        working-directory: ${{ matrix.module }}

  # The parity test needs a real broker with JetStream. A `services:`
  # container cannot take arguments, and the nats image needs `-js` — so
  # it is started explicitly here rather than declared and silently run
  # without the feature the test depends on.
  #
  # Without GT_NATS_URL the test SKIPS, so running it here is the
  # difference between "the archive holds everything the collector
  # wrote" being measured and being asserted.
  parity:
    name: broker — parity and snapshot shadow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/archive/go.mod

      - name: Start the event stream
        run: |
          docker run -d --name gt-nats -p 4222:4222 \
            nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927 \
            -js
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 4222; then echo "broker up"; exit 0; fi
            sleep 1
          done
          echo "broker did not come up"; docker logs gt-nats; exit 1

      - name: Parity
        env:
          GT_NATS_URL: nats://127.0.0.1:4222
        run: make parity

      - name: Snapshot shadow
        env:
          GT_NATS_URL: nats://127.0.0.1:4222
        run: make shadow

  quality:
    name: quality — lint + vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/collector/go.mod
          cache-dependency-path: |
            services/collector/go.sum
            libs/genproto/go.sum

      # Installs the version pinned in the Makefile, so a lint failure
      # here is reproducible with `make lint` and not an artefact of
      # whichever release the runner happened to fetch.
      - name: Lint
        run: make lint

      # SECURITY.md promises dependencies are checked against the Go
      # vulnerability database. Until now nothing did that.
      - name: Vulnerabilities
        run: make vuln

  experiments:
    name: experiments — syntax + selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Syntax-checks every tier and runs the statistics selftest, which
      # now asserts rather than merely printing. No browsers, no network,
      # no dependencies: this is the part of the experiment harness that
      # can be checked on every push, and it was unchecked entirely.
      # Repository tooling, not the statistics. The six numbers stay
      # stdlib-only; check-workflows.py parses YAML the way GitHub does.
      - name: Tooling dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Syntax + asserted selftest
        run: make experiments-check

      - name: The topology gates compile, and know when they cannot be cited
        run: make gates-check

  # The composed topology, brought up and interrogated.
  #
  # Nothing gated it before, and it broke twice without anything
  # noticing: a demo page naming an origin no in-network browser could
  # reach, and a stale image running a harness from before a variable
  # existed. Both were found by hand, days later.
  #
  # It runs shadow-http and kill-test rather than the full experiments
  # profile. The tier run needs browsers and about seven minutes, and it
  # re-measures detection rates that `make numbers` already measures
  # locally; what was actually broken both times was WIRING, which these
  # two check in a fraction of the time.
  topology:
    name: topology — shadow, kill-test and the books
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/decision-engine/go.mod
          cache-dependency-path: services/decision-engine/go.sum

      - name: Base image tags
        run: grep -E '^(GOLANG|DISTROLESS)_IMAGE=' .env.example >> "$GITHUB_ENV"

      - name: Bring the topology up
        run: |
          cp .env.example .env
          docker compose --profile core up -d --build
          # archive included since PR-5.2: it had no healthcheck to wait
          # on, so this gate ran — and passed — with the archive dead.
          for svc in collector decision-engine demo-web archive; do
            for i in $(seq 1 60); do
              state=$(docker inspect -f '{{.State.Health.Status}}' "ghost-trace-$svc-1" 2>/dev/null || echo starting)
              [ "$state" = healthy ] && break
              sleep 2
            done
            [ "$state" = healthy ] || { echo "::error::$svc never became healthy"; docker compose --profile core logs "$svc"; exit 1; }
          done

      - name: A/B the collector against the engine
        run: make shadow-http

      - name: Take each service away
        run: make kill-test

      # The Phase 3 gate, which until PR-5.6a ran only when somebody
      # remembered. It reconciles against the archive's DURABLE position
      # rather than process counters, and it refuses rather than skips —
      # both of which make it safe to run here.
      #
      # `make load-gate` is deliberately NOT added beside it. That one
      # measures RATES, and a rate measured on a shared runner encodes
      # the runner: this repository moved its timing assertions out of
      # CI after one machine reported an inlined commit at 48/s against
      # 18 244/s locally. loss-audit drives twenty-five records per
      # scenario and asserts arithmetic, not speed.
      - name: The books balance under an outage
        run: make loss-audit

      - name: Logs on failure
        if: failure()
        run: docker compose --profile core logs --tail=100

  # A single context for branch protection to require, instead of one
  # per job and one per matrix cell.
  #
  # Listing matrix contexts literally is the trap that already bit this
  # repository once: renaming a job silently removed its protection,
  # and every new module would need a settings change nobody would
  # remember to make. This name does not move when the matrix grows.
  #
  # `if: always()` plus an explicit result check is not decoration. A
  # summary job that simply `needs` others is SKIPPED when any of them
  # fails, and a skipped required check leaves a pull request waiting
  # forever — or worse, on some configurations, counts as success. It
  # has to run regardless and then decide.
  required:
    name: ci — all checks
    if: always()
    needs: [schemas, collector, modules, parity, quality, experiments, topology]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"

          # An expression that fails to evaluate yields an EMPTY string,
          # and a loop over nothing succeeds — the required check would
          # go green having verified nothing. That is not hypothetical:
          # join(needs.*.result, " ") with double quotes is a syntax
          # error, and it took both workflows down before this counted.
          #
          # The count is written out rather than derived, so adding a job
          # to `needs` and forgetting this line fails CLOSED.
          count=$(echo $results | wc -w | tr -d ' ')
          if [ "$count" != "7" ]; then
            echo "::error::expected 7 job results, read $count — the summary is not seeing what it guards"
            exit 1
          fi

          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all 7 required jobs succeeded"
