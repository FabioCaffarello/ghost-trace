# Dependency updates.
#
# Weekly and grouped: a stream of one-dependency pull requests trains
# people to merge without reading, which is the opposite of the point.
# One PR per ecosystem per week is small enough to actually review.
#
# Prefix `chore` with the scope included, so Dependabot's own pull
# request titles read `chore(deps): bump x` — Conventional Commits, the
# same rule CI enforces on every other PR title. `deps:` is not a type
# any release tool knows, and those PRs would arrive permanently red.
#
# There is deliberately no `docker` entry. Both Dockerfiles take their
# base image via ARG, sourced from .env.example, so there is no literal
# FROM tag for Dependabot to parse; those bumps run through
# deploy/docker/pin-base-images.sh and are a human decision. An entry
# here would open no PRs and quietly read as coverage.

version: 2

updates:
  # EVERY Go module, not two of nineteen. Until PR-5.0e this entry was
  # `directory: /services/collector` plus one for `/libs/genproto`, so
  # seventeen modules — including every one that speaks to the network:
  # eventstream (nats.go), archive, decision-engine — received no
  # security updates at all, and nothing said so. `directories` is a
  # single ecosystem entry across many paths, which keeps the weekly
  # volume at one grouped pull request rather than nineteen.
  #
  # scripts/check-modules.py asserts this list names every module on
  # disk, for the same reason it asserts the other three lists do.
  - package-ecosystem: gomod
    directories:
      - /services/collector
      - /services/archive
      - /services/decision-engine
      - /services/demo-web
      - /libs/archive
      - /libs/canonical
      - /libs/decision
      - /libs/eventstream
      - /libs/feature
      - /libs/genproto
      - /libs/id
      - /libs/metrics
      - /libs/middleware
      - /libs/policy
      - /libs/snapshot
      - /libs/substrate
      - /libs/tenant
      - /libs/wire
      - /tools/loadgen
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The protobuf runtime is an ARCHIVE-FORMAT pin, not a dependency.
      # Canonical bytes are hashed for content-addressed identity, so a
      # bump is an archive-compatibility event that needs the golden
      # hash fixture re-examined by a person — never an automatic merge.
      # See libs/canonical.
      #
      # The ignore has to cover every module or it covers none: the pin
      # arrived anyway once, through modules this file did not list,
      # and the tripwire went on testing a version nothing shipped.
      - dependency-name: google.golang.org/protobuf

  - package-ecosystem: npm
    directory: /experiments
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      experiment-tiers:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /experiments
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope

  # The supply chain that matters most here: these actions run with a
  # token against this repository, and they are pinned by SHA precisely
  # so that upgrading is a reviewed act rather than a silent one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
