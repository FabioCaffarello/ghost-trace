# Ghost Trace — compose topology for the all-in-one slice.
#
# Profiles (combine as needed):
#
#   core           the topology: collector + demo page, decision engine,
#                  event stream, archive on a named volume
#                    docker compose --profile core up
#                  With it up, `make shadow-http` A/Bs the collector
#                  against the decision engine over real HTTP.
#   demo           the topology with human-capture enabled; rows land in
#                  ./experiments/results/human_sessions.jsonl on the host
#                    docker compose --profile demo up
#                  (core and demo both claim 127.0.0.1:8083 — run one)
#   experiments    the adversarial tiers against the running topology
#                    docker compose --profile core --profile experiments \
#                      run --rm experiments
#                  BOTH profiles are needed even to BUILD it: the service
#                  depends on collector, which lives in core, and compose
#                  refuses a project with an undefined dependency. And
#                  `--profile core up --build` does NOT rebuild this
#                  image — a stale one runs an old copy of experiments/
#                  and fails in ways that look like a topology problem.
#                  It cost an afternoon once.
#   observability  Prometheus scraping /metrics, bound to 127.0.0.1:9090
#                    docker compose --profile core --profile observability up
#
# Base-image digests come from .env — copy .env.example and run
# deploy/docker/pin-base-images.sh to resolve them. Without a .env the
# floating-tag defaults below apply (fine for development; pinning is
# what makes a rebuild six months from now byte-identical).
#
# Ports bind 127.0.0.1 only: nothing here is hardened for exposure.

x-hardened: &hardened
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-collector-build: &collector-build
  context: .
  dockerfile: deploy/docker/Dockerfile.collector
  args:
    GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.26-alpine}
    DISTROLESS_IMAGE: ${DISTROLESS_IMAGE:-gcr.io/distroless/static-debian12:nonroot}

services:
  collector:
    <<: *hardened
    profiles: [core, demo]
    image: ghost-trace/collector:${IMAGE_TAG:-dev}
    build: *collector-build
    command:
      - -addr=0.0.0.0:8080
      - -data=/data
      - -mode=${GT_MODE:-monitor}
      - -site-key=${GT_SITE_KEY:-pk_demo}
      - -secret-key=${GT_SECRET_KEY:-sk_demo}
      # The demo page is served by another origin now, so the browser
      # endpoints have to answer a cross-origin request — which is what
      # every real integration does and what being same-origin with the
      # demo used to hide. Allowlist, never "*", and it covers
      # /v1/sessions and /v1/telemetry only: the secret-key endpoints
      # are server-to-server and a page must never reach them.
      - -cors-origin=${GT_DEMO_ORIGIN:-http://127.0.0.1:8083},${GT_DEMO_ORIGIN_INTERNAL:-http://demo-web-internal:8083}
      # Transitional dual-write: records still land in the local
      # substrate, and a copy is mirrored to the archive service. The
      # local write stays authoritative — a broker outage is counted,
      # never surfaced.
      - -nats=nats://nats:4222
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - gt-data:/data
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      # Execs the binary itself: distroless ships no shell or curl.
      test: ["CMD", "/ghost-trace", "-healthcheck", "-addr", "0.0.0.0:8080"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # The demo host: the only service here that is NOT Ghost Trace. It
  # stands in for a customer's site — its own origin, embedding the SDK,
  # calling /v1/decisions server-to-server with the secret key. The page
  # never sees that key.
  demo-web:
    <<: *hardened
    profiles: [core]
    image: ghost-trace/demo-web:${IMAGE_TAG:-dev}
    build: &demo-build
      context: .
      dockerfile: deploy/docker/Dockerfile.demo-web
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.26-alpine}
        DISTROLESS_IMAGE: ${DISTROLESS_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
    command: &demo-command
      - -addr=0.0.0.0:8083
      # TWO DIFFERENT KINDS OF ADDRESS, and they are not
      # interchangeable.
      #
      # -api is substituted into the PAGE, so it must be what the
      # operator's browser can reach: a host address, not a container
      # name.
      #
      # -engine is dialled by THIS PROCESS, server-to-server, from
      # inside the compose network — so it must be the container name. A
      # host address here resolves to this container, the decision call
      # fails, and §5 fail-open turns that into a permanent "allow" that
      # looks like a working demo. It did exactly that before this
      # comment existed.
      - -api=${GT_API_ORIGIN:-http://127.0.0.1:8080}
      - -engine=${GT_ENGINE_SERVICE:-http://decision-engine:8082}
      - -site-key=${GT_SITE_KEY:-pk_demo}
      - -secret-key=${GT_SECRET_KEY:-sk_demo}
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      decision-engine:
        condition: service_healthy
    healthcheck: &demo-health
      test: ["CMD", "/demo-web", "-healthcheck", "-addr", "0.0.0.0:8083"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # The capture variant for the human study: same image, capture log
  # bind-mounted to the host where analyze.py reads it. Capture belongs
  # to the demo host because it records what the HOST APPLICATION
  # learned about a session, not what the collector observed.
  demo-web-capture:
    <<: *hardened
    profiles: [demo]
    image: ghost-trace/demo-web:${IMAGE_TAG:-dev}
    build: *demo-build
    command:
      - -addr=0.0.0.0:8083
      - -api=${GT_API_ORIGIN:-http://127.0.0.1:8080}
      - -engine=${GT_ENGINE_SERVICE:-http://decision-engine:8082}
      - -site-key=${GT_SITE_KEY:-pk_demo}
      - -secret-key=${GT_SECRET_KEY:-sk_demo}
      - -capture-log=/captures/human_sessions.jsonl
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./experiments/results:/captures
    healthcheck: *demo-health
    restart: unless-stopped

  # The event stream. JetStream on, file-backed, so a restart does not
  # lose records the archive has not consumed yet.
  nats:
    <<: *hardened
    profiles: [core, demo]
    image: ${NATS_IMAGE:-nats:2.10-alpine}
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      # /healthz on the monitoring port; the image has no curl, so this
      # uses the nats binary's own readiness probe.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # The decision engine: the same two endpoints the collector serves,
  # answered from the snapshots the collector publishes instead of from
  # sessions it observed. It is mounted from the same package (ADR-0005),
  # so the only thing that differs is where the state came from — which
  # is exactly what `make shadow-http` compares while both are up.
  #
  # No volume: it holds no session state and has no local store.
  decision-engine:
    <<: *hardened
    profiles: [core, demo]
    image: ghost-trace/decision-engine:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.decision-engine
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.26-alpine}
        DISTROLESS_IMAGE: ${DISTROLESS_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
    command:
      - -addr=0.0.0.0:8082
      - -nats=nats://nats:4222
      - -mode=${GT_MODE:-monitor}
      - -tenant=${GT_TENANT:-t_demo}
      - -secret-key=${GT_SECRET_KEY:-sk_demo}
      # Must match the collector's -session-ttl: it is the snapshot
      # bucket's TTL, and two services declaring different lifetimes for
      # the same bucket is a race over when a session stops existing.
      - -session-ttl=${GT_SESSION_TTL:-30m}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/decision-engine", "-healthcheck", "-addr", "0.0.0.0:8082"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # The archive service: consumes the stream, stores nothing else.
  archive:
    <<: *hardened
    profiles: [core, demo]
    image: ghost-trace/archive:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.archive
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.26-alpine}
        DISTROLESS_IMAGE: ${DISTROLESS_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
    command:
      - -addr=0.0.0.0:8081
      - -data=/data
      - -nats=nats://nats:4222
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - gt-archive-data:/data
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # The demo host as a browser INSIDE this network sees it.
  #
  # It exists because ONE PAGE CANNOT NAME AN ORIGIN THAT IS RIGHT FOR
  # BOTH. The page substitutes an absolute API origin, and the operator's
  # browser needs 127.0.0.1 while a browser in the experiments container
  # needs a service name. Serving the operator's page to the tiers meant
  # the SDK tried to reach 127.0.0.1:8080 — itself — and every browser
  # tier reported "no sessions completed".
  #
  # No published port: nothing outside this network addresses it.
  demo-web-internal:
    <<: *hardened
    profiles: [experiments]
    image: ghost-trace/demo-web:${IMAGE_TAG:-dev}
    build: *demo-build
    command:
      - -addr=0.0.0.0:8083
      - -api=${GT_API_URL:-http://collector:8080}
      - -engine=${GT_ENGINE_SERVICE:-http://decision-engine:8082}
      - -site-key=${GT_SITE_KEY:-pk_demo}
      - -secret-key=${GT_SECRET_KEY:-sk_demo}
    depends_on:
      collector:
        condition: service_healthy
    healthcheck: *demo-health
    restart: unless-stopped

  experiments:
    <<: *hardened
    profiles: [experiments]
    image: ghost-trace/experiments:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.experiments
      args:
        PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.49.1-noble}
    environment:
      GT_BASE: http://collector:8080
      GT_DEMO_BASE: http://demo-web-internal:8083
      GT_SITE_KEY: ${GT_SITE_KEY:-pk_demo}
      GT_SECRET_KEY: ${GT_SECRET_KEY:-sk_demo}
    volumes:
      # Results land on the host so numbers.json survives the container.
      - ./experiments/results:/work/experiments/results
    depends_on:
      collector:
        condition: service_healthy
      demo-web-internal:
        condition: service_healthy
    restart: "no"

  prometheus:
    <<: *hardened
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    restart: unless-stopped

volumes:
  gt-data:
  gt-archive-data:
  nats-data:
  prom-data:
