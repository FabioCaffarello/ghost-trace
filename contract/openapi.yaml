          enum:
          - allow
          - challenge
          - block
          type: string
      required:
      - evaluation_id
      - decision
      - score
      - confidence
      - reasons
      - evidence
      - mode
      type: object
    ErrorResponse:
      additionalProperties: false
      description: ErrorResponse is the single error body shape.
      properties:
        error:
          description: Human-readable failure reason. Not a stable enumeration; do
