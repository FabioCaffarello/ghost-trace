      - error
      type: object
    OutcomesRequest:
      additionalProperties: false
      description: OutcomesRequest labels a past evaluation with what actually happened.
      properties:
        evaluation_id:
          description: evaluation_id returned by POST /v1/decisions; required
          type: string
        observed_at:
          description: RFC 3339 timestamp of the application's observation. Optional;
