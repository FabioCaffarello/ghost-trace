          type: string
      required:
      - session_token
      - expires_in
      - collect
      type: object
    TelemetryBatch:
      additionalProperties: false
      description: TelemetryBatch is one flush from the browser SDK.
      properties:
        events:
          description: The interaction events in this flush. Order is the order observed.
          items:
            $ref: '#/components/schemas/TelemetryEvent'
          type: array
        page:
          $ref: '#/components/schemas/TelemetryPage'
        sent_at_ms:
          description: Milliseconds since session start when the batch was flushed
          type: integer
        seq:
          description: Monotonic batch counter within the session. Used to detect
            loss rather than to order.
          type: integer
        session_token:
          description: 'Session token. May instead travel as an Authorization: Bearer
            header; the header wins when both are present.'
          type: string
      type: object
    TelemetryEvent:
      additionalProperties: false
      description: TelemetryEvent is one interaction event.
      properties:
        action:
          description: 'form: what happened to the field. ''injected'' is the strongest
            single bot signal — a value that appeared with no keystroke and no paste
            behind it; ''paste'' exists so a human pasting is not mistaken for one'
          enum:
          - paste
          - autofill
          - injected
          - submit
          type: string
        class:
          description: 'key: COARSE key class. Never the key itself — no keylogging
