          enum:
          - focus
          - blur
          - visible
          - hidden
          type: string
        t:
          description: Milliseconds since session start
          type: integer
        target:
          description: 'key or form: coarse field role — never the field value'
          type: string
        type:
          description: Event family; selects which of the fields below apply
          enum:
