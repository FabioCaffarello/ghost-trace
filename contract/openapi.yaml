          type: string
        evidence:
          $ref: '#/components/schemas/DecisionEvidence'
        mode:
          description: Operating mode of the service
          enum:
          - monitor
          - enforce
          type: string
        reasons:
          description: Contributing factors. Present so a decision can be explained
