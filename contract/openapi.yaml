          items:
            $ref: '#/components/schemas/DecisionReason'
          type: array
        score:
          description: How bot-like the interaction looks. Rounded to three decimals.
          maximum: 1
          minimum: 0
          type: number
        shadow_decision:
          description: 'In monitor mode: what enforce mode WOULD have returned. Absent
