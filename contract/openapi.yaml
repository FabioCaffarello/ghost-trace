          enum:
          - alpha
          - digit
          - nav
          - mod
          - whitespace
          - other
          type: string
        dy:
          description: 'scroll: vertical delta in CSS pixels'
          type: integer
        mode:
          description: 'scroll: whether a real wheel gesture produced it or the page
            scrolled itself'
          enum:
          - wheel
          - programmatic
          type: string
        phase:
          description: 'key: keystroke phase. Dwell is down to up on one key; flight
