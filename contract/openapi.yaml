          enum:
          - down
          - up
          type: string
        pts:
          description: 'pointer: samples as [x y t_offset_ms] triples'
          items:
            items:
              type: integer
            maxItems: 3
            minItems: 3
            type: array
          type: array
        src:
          description: 'pointer: input source that produced the samples'
          type: string
        state:
          description: 'focus or visibility: the state entered. focus and blur for
