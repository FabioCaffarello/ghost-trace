// Category III hypothesis lifecycle event per Charter §2.5
// (Hypothesis Lifecycle Explicitness, frozen v0.3) +
// lifecycle-semantics.md §Hypothesis (Category III) — fourth of
// six lifecycle operations recorded as immutable discrete events.
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
//
// Constitutional shape per Charter §2.5: dissolution recognizes
// that the underlying phenomenon the hypothesis claimed to track
// no longer exists (or never existed) and marks the hypothesis
// as no longer active. Per glossary + lifecycle-semantics.md
// line 36, dissolution is DISTINGUISHED from demotion: demotion
// withdraws OPERATIONAL USE; dissolution recognizes NON-EXISTENCE
// of the underlying phenomenon. The two operations are not
// interchangeable and target different referents — demotion
// references a specific promotion event (which cadence gate is
// closing); dissolution references the hypothesis itself (the
// formation, which IS the hypothesis identity per §0045).
//
// Dissolution may occur regardless of whether the hypothesis was
// ever promoted. A formation that was never admitted to
// operational use can still be recognized as not corresponding
// to any phenomenon; the substrate does not constrain ordering
// between dissolution and the optional promotion/demotion arc.
//
// Per §2.5 BC3 ("current state ... rather than as a projection
// over the operation event history" is forbidden), no
// denormalized "currently_promoted" or "promotion_event_hash"
// field appears here — the projection layer reconstructs the
// chain of lifecycle events.
//
// Per §2.5 BC5 ("lifecycle events are Category I records under
// §2.5"), BehavioralClusterDissolution is a Category I substrate
// row committed under §2.1 immutability.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// BehavioralClusterDissolution records the recognition that a
// BehavioralCluster hypothesis no longer corresponds to any
// underlying phenomenon, per Charter §2.5 + lifecycle-semantics.md.
message BehavioralClusterDissolution {
  // formation_event_hash is the BLAKE3-256 content-hash of the
  // BehavioralClusterFormation event identifying the hypothesis
  // being dissolved. Per §0045 hypothesis identity IS the
  // formation event's content-hash; dissolution targets the
  // hypothesis directly (no two-hop indirection through
  // promotion, unlike demotion).
  bytes formation_event_hash = 1;

  // dissolved_at is the Unix-nanoseconds time at which dissolution
  // was recorded. Typically wall-clock at the operator's or
  // inference process's decision; explicit values permitted for
  // forensic replay + deterministic re-derivation.
  int64 dissolved_at = 2;

  // reason is an operator-supplied free-form note explaining why
  // the hypothesis was recognized as no longer corresponding to
  // any underlying phenomenon. Optional; recorded for forensic
  // replay. Empty is acceptable but discouraged at audit time —
  // dissolution is the terminal lifecycle operation on a
  // hypothesis and the absence of a reason removes the only
  // record of the underlying judgment.
  string reason = 3;
}
