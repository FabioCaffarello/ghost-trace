// Category III hypothesis lifecycle event per Charter §2.5 +
// lifecycle-semantics.md line 29 + decision-log §0061 (this entry —
// SIXTH (final) lifecycle operation of the second Cat III subtype
// arc; mirrors §0050 for the AutomationGroup concrete subtype;
// closes the AutomationGroup lifecycle surface).
//
// SCOPE — within-subtype only at this proto. The antecedent and all
// successors are AutomationGroupFormation events. Cross-subtype
// split is committee-closed at the framing level via decision-log
// §0122-§0127 split-merge symmetric framing; per §0127 structural
// commitment 3 the existing target formation protos are unchanged.
// Per-cell sub-parameters for cross-subtype split remain follow-on
// RFC discipline; this proto retains its within-subtype shape.
//
// Structural choice (mirrors §0050 + §0049 Option B): each
// successor is a separately-committed AutomationGroupFormation —
// preserves the §0045+§0056 hypothesis-identity invariant across
// the entire lifecycle surface uniformly.
//
// Per §2.5 BC3, no denormalized state field. Per §2.5 BC5, the
// split event is a Cat I record under §2.1.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// AutomationGroupSplit records the recognition that an
// AutomationGroup hypothesis contained multiple distinct
// phenomena and has been divided into successor hypotheses.
message AutomationGroupSplit {
  // antecedent_formation_event_hash is the BLAKE3-256 content-
  // hash of the AutomationGroupFormation being split. Single
  // antecedent (1-to-N shape, asymmetric vs merge's 2-to-1).
  bytes antecedent_formation_event_hash = 1;

  // successor_formation_event_hashes is the set of BLAKE3-256
  // content-hashes of the AutomationGroupFormation events
  // representing the successor hypotheses produced by the split.
  //
  // Sorted ASCENDING for content-hash stability (set-equality
  // idempotency per §0050). Cardinality MUST be ≥ 2; all entries
  // MUST be byte-distinct from each other AND from
  // antecedent_formation_event_hash.
  repeated bytes successor_formation_event_hashes = 2;

  // split_at is the Unix-nanoseconds time at which the split
  // recognition was recorded.
  int64 split_at = 3;

  // reason is an operator-supplied free-form note. Optional but
  // strongly recommended.
  string reason = 4;
}
