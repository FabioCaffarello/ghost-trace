// Category I primary observation per Charter §2.1 + §2.2 +
// entity-model.md §Category I. BehavioralObservation is the typed
// Cat I observation for human-input behavioral surface (mouse,
// keyboard, scroll, pointer-dwell). Second F1 modality per Domain
// Pack v0.1 §0143 mês 2 P0 sequencial; established by §0146.
//
// Discriminated-union pattern inherited from §0144 NetworkObservation
// (Methodological observation 3 — discriminated-union framing
// cascades to all four F1 Cat I modalities). Four sub-modalities in
// this version: mouse_trajectory, keystroke_timing, scroll_cadence,
// pointer_dwell. touch_gesture (mobile-specific) deferred to a
// future sub-RFC per §0146 (b) — anticipated pattern parallel to the
// §0144 (c) AttestationObservation cascade.
//
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md. Per §0146
// constitutional review: BehavioralObservation declares NEITHER
// `confidence` NOR `evidential_independence` fields — structurally
// excluded from the validatePairedDimensionCommitment subject set
// per §2.6 BC3 (paired-dimension applies to Cat II / Cat III only;
// Cat I observation records carry no inferential commitment).
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

import "events/v1/behavioral_mouse_trajectory.proto";
import "events/v1/behavioral_keystroke_timing.proto";
import "events/v1/behavioral_scroll_cadence.proto";
import "events/v1/behavioral_pointer_dwell.proto";

// BehavioralObservation is a typed Cat I primary observation about a
// human-input behavioral surface. Each instance carries exactly one
// of the four sub-modality payloads via the `modality` oneof; the
// envelope carries the invariant fields (observation time, actor
// attribution, optional session context, collector provenance).
message BehavioralObservation {
  // observed_at is the collector-reported observation time as Unix
  // nanoseconds since epoch. int64 chosen per decision-log §0024
  // modification 6 (canonical-form-load-bearing time fields use int64
  // Unix nanoseconds, not google.protobuf.Timestamp, for content-hash
  // stability). Parallel to NetworkObservation.observed_at and
  // DeclaredSession.declared_at.
  int64 observed_at = 1;

  // actor_ref is the single-tier actor identity reference per
  // decision-log §0023 (Q2 Identity tiers resolution — inception-phase
  // single-tier actor_ref adopted; multi-tier formalization deferred
  // to ordinary Ontology RFC discipline). Optional: empty string =
  // unattributed observation.
  string actor_ref = 2;

  // session_ref is an optional producer-supplied identifier of the
  // session context in which the behavioral observation occurred.
  // Format: opaque string negotiated out-of-band with the producer
  // (typically the producer's session UUID or the hex of the
  // DeclaredSession's content-addressable identifier). Per §0146
  // constitutional discipline: producer-supplied identifier
  // (parallel to actor_ref shape, NOT a substrate-verifiable BLAKE3
  // reference like IngestionEvent.primary_event_hash). Substrate
  // verifiability against a specific DeclaredSession record may be
  // added later via enrichment record if structurally required.
  // Empty string = no session context (e.g., observation outside any
  // declared session, or session anchoring deferred).
  string session_ref = 3;

  // collector_ref identifies the adapter / ingestion-source that
  // produced this record (e.g. "synthetic-behavioral-gen:v0",
  // "browser-sdk:v1", "honeypot-behavioral-collector:hp-01"). Per
  // decision-log §0144 (e) + §0146: structural seed for the
  // phenomenon-vs-record reconciliation OMQ anticipated by §0143;
  // operationally exercised by every Cat I observation adapter.
  string collector_ref = 4;

  // modality discriminates which sub-modality payload is carried.
  // Exactly one of the four sub-modality messages is populated per
  // observation; mutual exclusivity is enforced by the proto3 oneof
  // discipline at the marshalling boundary.
  oneof modality {
    BehavioralMouseTrajectory mouse_trajectory = 5;
    BehavioralKeystrokeTiming keystroke_timing = 6;
    BehavioralScrollCadence scroll_cadence = 7;
    BehavioralPointerDwell pointer_dwell = 8;
  }
}
