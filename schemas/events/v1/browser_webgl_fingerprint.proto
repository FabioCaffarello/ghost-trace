// Sub-modality of BrowserObservation per §0151 discriminated-union
// framing. Carries WebGL renderer + capabilities fingerprint per the
// WebGL-fingerprinting technique (Mowery, Shacham et al. + EFF
// Panopticlick). Privacy-preserving design per §0146 + §0147:
// extensions_hash (BLAKE3) compresses sorted extension list to a
// fixed-size identifier without committing the raw list.
//
// No `confidence` / `evidential_independence` fields — Cat I sub-
// modality payload, structurally excluded from paired-dimension
// per §2.6 BC3.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// BrowserWebGLFingerprint is the WebGL renderer + capabilities
// payload carried by BrowserObservation when the modality is
// `webgl_fingerprint`.
message BrowserWebGLFingerprint {
  // vendor is the WebGL UNMASKED_VENDOR_WEBGL string per the
  // WEBGL_debug_renderer_info extension (e.g. "Intel Inc.",
  // "Google Inc. (Apple)", "NVIDIA Corporation"). Public string;
  // committed as-is for substrate-side correlation.
  string vendor = 1;

  // renderer is the WebGL UNMASKED_RENDERER_WEBGL string per the
  // WEBGL_debug_renderer_info extension (e.g. "Intel(R) UHD Graphics
  // 620", "Apple M1 Pro", "ANGLE (NVIDIA, NVIDIA GeForce RTX 3080)").
  // Public string; committed as-is.
  string renderer = 2;

  // extensions_hash is the BLAKE3-256 hash of the sorted ALPHA-
  // sorted list of supported WebGL extension names per
  // getSupportedExtensions(). 32-byte fixed length. Cross-
  // observation correlation: two observations with the same
  // extensions_hash share the same WebGL extension set.
  bytes extensions_hash = 3;

  // max_texture_size is the GL_MAX_TEXTURE_SIZE value (the maximum
  // texture dimension the renderer reports). Well-known
  // fingerprinting axis distinguishing GPU classes. 0 = not
  // observed.
  uint32 max_texture_size = 4;
}
