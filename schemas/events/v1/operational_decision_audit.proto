// Category I primary observation per Charter §2.2 + entity-model.md
// §Category I. Records an operator-elected enforcement decision
// (allow / challenge / block / shadow) taken on a subject actor under a
// versioned policy, committed to the substrate as the §3 N3 audit-on-
// commit record. The audit is a record of HISTORICAL FACT — "the
// operator/policy decided V on actor A at time T" — not an inference;
// the inferential content it acts on (a Cat III hypothesis) is
// referenced by hash, never restated here.
//
// Introduced by decision-log §0222 (Framing A resolution of the
// operational-decision RFC: Decision = Cat I audit record). It is the
// fourth layer of the anti-bot vertical slice (§0221: collection →
// inference → replay; §0222 adds decision). Per §3 N3 the substrate is
// NOT the actor: this record is committed by an operator-elected path
// (operator_ref names the elector); a decision with no audit record is
// the structural anomaly N3 forbids. The signature/inference layers
// never auto-commit a decision.
//
// No `confidence` / `evidential_independence` fields — Cat I record of
// fact, structurally excluded from the paired-dimension commitment per
// §2.6 BC3 (paired dimensions are for inferential-assertion records;
// this audit references the inferential hypothesis, it does not embody
// it). The verdict's policy-evaluation is deterministic given the
// referenced hypothesis + policy_ref; under Framing A that evaluation
// is applied in-process and is re-derivable by looking up policy_ref's
// versioned definition against the referenced hypothesis (the Framing-B
// Cat II DecisionConstruct that would make re-derivation a substrate
// record is deferred per §0222 until empirical pressure surfaces it).
//
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// OperationalDecisionAudit is the substrate-committed record of an
// operator-elected enforcement decision per decision-log §0222.
message OperationalDecisionAudit {
  // DecisionType is the enforcement verdict. Values name the action
  // structurally (anti-marketing watchlist discipline per §0149 MO4):
  // ALLOW (no friction), CHALLENGE (interpose an attestation step),
  // BLOCK (refuse), SHADOW (permit but mark for observation).
  enum DecisionType {
    // DECISION_TYPE_UNSPECIFIED is the proto3 default; a committed
    // audit MUST set a concrete verdict (UNSPECIFIED is structurally
    // malformed for a committed decision).
    DECISION_TYPE_UNSPECIFIED = 0;
    DECISION_TYPE_ALLOW = 1;
    DECISION_TYPE_CHALLENGE = 2;
    DECISION_TYPE_BLOCK = 3;
    DECISION_TYPE_SHADOW = 4;
  }

  // decision_type is the enforcement verdict the operator/policy
  // elected. Field 1 (the load-bearing content of the record).
  DecisionType decision_type = 1;

  // subject_actor_ref is the single-tier actor identity the decision
  // was taken on, per §0023 (inception-phase single-tier actor_ref).
  string subject_actor_ref = 2;

  // decided_at is the decision time as Unix nanoseconds since epoch.
  // int64 per §0024 modification 6 (canonical-form-load-bearing time
  // fields use int64 Unix nanoseconds, not google.protobuf.Timestamp,
  // for content-hash stability).
  int64 decided_at = 3;

  // source_observation_hashes are the BLAKE3-256 content-hashes of the
  // Cat I observations in the §2.3 provenance chain grounding the
  // decision (typically inherited from the influencing hypothesis's
  // source_event_hashes). §0139 hash-list element-shape discipline:
  // each entry 32 bytes; ascending lexicographic order; no duplicates.
  repeated bytes source_observation_hashes = 4;

  // influencing_hypothesis_hashes are the BLAKE3-256 content-hashes of
  // the Cat III hypothesis formation events whose promotion/presence
  // the policy acted on. These are the inferential antecedents of the
  // decision; the decision points to them, it does not restate their
  // inferential commitment (§2.2). §0139 element-shape discipline:
  // 32 bytes; ascending; no duplicates.
  repeated bytes influencing_hypothesis_hashes = 5;

  // policy_ref is the versioned identifier of the policy that mapped
  // the inference to the verdict (e.g. "automation-tiered-v1"). Under
  // Framing A the policy evaluation is in-process; policy_ref + the
  // referenced hypothesis are the re-derivation handle (§0222).
  string policy_ref = 6;

  // operator_ref names the operator (or operator-configured automation
  // identity) that ELECTED the decision. §3 N3: the presence of this
  // field at the substrate IS the structural evidence that the action
  // was operator-initiated, not autonomous substrate-side action.
  // Optional only in the proto3-default sense; a committed audit should
  // carry it for N3 forensic completeness.
  string operator_ref = 7;
}
