// Sub-modality of BrowserObservation per §0151 discriminated-union
// framing. Carries HTTP header ordering observation — well-known
// anti-bot axis distinguishing browser stacks (browsers emit
// headers in specific orders determined by their HTTP client
// implementation; automation tools emit different orderings).
//
// Header names are protocol-public; committed as raw strings for
// substrate-side correlation. Header VALUES are NOT committed —
// values may carry user-private information (cookies,
// authentication tokens); ordering alone is the fingerprinting
// surface.
//
// No `confidence` / `evidential_independence` fields — Cat I sub-
// modality payload, structurally excluded from paired-dimension
// per §2.6 BC3.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// BrowserHeaderOrder is the HTTP header ordering payload carried by
// BrowserObservation when the modality is `header_order`.
message BrowserHeaderOrder {
  // header_sequence is the ordered list of HTTP header names as
  // observed in the request. Example sequences distinguishing
  // common browsers: Chrome typically emits "Host", "Connection",
  // "Cache-Control", "sec-ch-ua", ...; Firefox emits a different
  // ordering. Header VALUES are intentionally NOT carried — only
  // the ordering surface.
  repeated string header_sequence = 1;

  // header_count is the total count of headers observed. Equals
  // len(header_sequence); preserved explicitly for forensic-replay-
  // without-array-iteration.
  uint32 header_count = 2;
}
