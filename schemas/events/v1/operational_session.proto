// Category II operational construct per Charter §2.2 + entity-model.md
// §Category II + decision-log §0015 (Q1 resolution — OperationalSession
// is the canonical Cat II construct, derived deterministically from
// DeclaredSession + other Cat I inputs under a versioned operational
// definition) + §0133 (Q3-α evidential-independence) + §0134 (Q5-τ
// transitive closure + Cat II structural transmission) + §0136
// (canonical-serialization-contract operational discharge of §2.6
// paired-dimension + Q3-α + Q5-τ + Cat II closure-union transmission).
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
//
// Identity composition per entity-model.md §Category II Structural
// properties: an OperationalSession's identity composes
// (definition_version, definition_parameters, source_event_hash). Re-
// derivation under a NEW (definition_version, definition_parameters)
// tuple produces a NEW record; the prior derivation is preserved.
// Identity-tier (actor_ref) defaults to the source DeclaredSession's
// per entity-model.md line 36.
//
// Per Charter §2.6 (Evidential Independence Integrity, frozen v0.6 +
// patched v0.7.1) + §0136 paired-dimension commitment: Cat II
// constructs carry both confidence (magnitude) and
// evidential_independence (degree) at substrate commit. Per §0134
// Cat II structural-transmission commitment + §0136: closure_hashes
// IS the union of the closure_hashes of records this Cat II is
// deterministically derived from — substrate write-time validation
// recomputes the union and compares; mismatch is rejected.
syntax = "proto3";

package ghosttrace.events.v1;

import "common/v1/evidential_independence.proto";

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// OperationalSession is the system's reading of where a session
// operationally was, derived from a DeclaredSession under a versioned
// operational definition. The boundary may diverge from the source
// DeclaredSession's declared_at; the divergence is the structural
// signal per Charter §2.2 + entity-model.md §Category II.
message OperationalSession {
  // definition_version is the stable identifier of the operational
  // definition that produced this construct. First version:
  // "padded-v1". Versioning is explicit per entity-model.md line 46
  // ("Definitions are versioned. The definition that produced a
  // construct is part of its identity.").
  string definition_version = 1;

  // definition_parameters is the canonical-form string representation
  // of the parameters the operational definition was invoked under.
  // Part of identity per entity-model.md line 44 ("Identity composes
  // the definition reference, its parameters, and its time scope.").
  // Encoding contract: lowercase key=value pairs separated by
  // semicolons, sorted by key (e.g. "pad_seconds=300"). The
  // canonical-form discipline is necessary so that re-derivation under
  // logically-identical parameters produces a content-hash-identical
  // record.
  string definition_parameters = 2;

  // source_event_hash is the BLAKE3-256 content hash of the source
  // DeclaredSession. Provenance reference per Charter §2.3 (Provenance
  // Integrity, frozen v0.4). The reverse direction
  // (DeclaredSession → OperationalSessions derived from it) is
  // recovered by index lookup at read time.
  bytes source_event_hash = 3;

  // actor_ref is the single-tier actor identity reference per
  // decision-log §0023. Defaults to the source DeclaredSession's
  // actor_ref per entity-model.md line 36 (identity-tier consistency
  // rule); the operational definition may override when the
  // operational reading differs from the declared.
  string actor_ref = 4;

  // operational_start_at is the operational-definition-derived start
  // time as Unix nanoseconds. May differ from the source
  // DeclaredSession's declared_at per entity-model.md line 34
  // ("OperationalSession may diverge from its source DeclaredSession
  // in boundary timing").
  int64 operational_start_at = 5;

  // operational_end_at is the operational-definition-derived end
  // time as Unix nanoseconds. May differ from any time on the source
  // DeclaredSession; the divergence is the structural signal
  // (per entity-model.md line 34).
  int64 operational_end_at = 6;

  // confidence is the paired-dimension magnitude per Charter §2.6
  // (frozen v0.6 + patched v0.7.1) + §0136 paired-dimension
  // commitment. Scalar in [0.0, 1.0]. For inception-phase
  // deterministic operational definitions (e.g. "padded-v1"), the
  // derivation is mechanically reproducible from inputs and
  // confidence in the operational reading defaults to 1.0; future
  // operational definitions with intrinsic uncertainty may carry
  // values below 1.0. The substrate enforces presence at canonical-
  // marshalling per §0136.
  float confidence = 7;

  // evidential_independence is the paired dimension to confidence
  // per Charter §2.6 (frozen v0.6 + patched v0.7.1) + §0136. Computed
  // per Q3-α (decision-log §0133): ratio of Cat I roots NOT reachable
  // via influenced_by from a promoted hypothesis, divided by total
  // Cat I roots in the subject_ref_* chain. Rational-pair encoding
  // (numerator / denominator) preserves the bounded-resolution
  // structural commitment per §0133 Phase 4 Finding 4. For
  // inception-phase OperationalSessions with no promoted-hypothesis
  // influence in the source DeclaredSession's chain, α = 1/1
  // (full evidential independence).
  ghosttrace.common.v1.EvidentialIndependence evidential_independence = 8;

  // direct_influenced_by is the list of Cat III hypothesis content-
  // hashes that the operational definition directly declares as
  // influencing this Cat II derivation per Charter §2.4 (Inferential
  // Influence Disclosure, frozen v0.5). Typically empty for inception-
  // phase deterministic definitions like "padded-v1" that do not
  // reference any promoted hypothesis; populated when an operational
  // definition incorporates promoted-hypothesis enrichment context
  // into its derivation. Sorted ASCENDING lexicographic order;
  // elements are 32-byte BLAKE3 content-hashes.
  repeated bytes direct_influenced_by = 9;

  // closure_hashes is the transitive closure per Q5-τ (decision-log
  // §0134) + §0136 Influence Storage. Per the Cat II structural-
  // transmission commitment (§0134 + §0136), this field MUST equal
  // the UNION of the source DeclaredSession's closure_hashes and
  // any other input records' closure_hashes, merged with this
  // record's own direct_influenced_by. Substrate write-time
  // recomputes the union and compares element-by-element; mismatch
  // is rejected. Sorted ASCENDING lexicographic order; elements are
  // 32-byte BLAKE3 content-hashes. Empty when the input chain has
  // no transitive promoted-hypothesis influences (the typical case
  // at inception phase — Cat I-only chain).
  repeated bytes closure_hashes = 10;
}
