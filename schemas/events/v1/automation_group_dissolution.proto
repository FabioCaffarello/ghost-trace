// Category III hypothesis lifecycle event per Charter §2.5 +
// decision-log §0059 (this entry — second-subtype dissolution
// landing; mirrors §0048 for the AutomationGroup concrete subtype).
//
// Per glossary + lifecycle-semantics.md line 36, dissolution is
// DISTINGUISHED from demotion: demotion withdraws OPERATIONAL USE;
// dissolution recognizes NON-EXISTENCE of the underlying
// phenomenon. The distinction transfers across subtypes — an
// AutomationGroup may be demoted (cycle close) or dissolved
// (recognition that no automation signature actually exists, or
// that the signature was misattributed).
//
// Per §0045 + §0056 hypothesis identity IS the formation event's
// content-hash; dissolution targets the formation directly (no
// two-hop indirection through promotion, unlike demotion).
//
// Per §2.5 BC3, no denormalized state field. Per §2.5 BC5, the
// dissolution event is a Cat I record under §2.1.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// AutomationGroupDissolution records the recognition that an
// AutomationGroup hypothesis no longer corresponds to any
// underlying phenomenon.
message AutomationGroupDissolution {
  // formation_event_hash is the BLAKE3-256 content-hash of the
  // AutomationGroupFormation event identifying the hypothesis
  // being dissolved (per §0045 + §0056 — hypothesis identity IS
  // the formation event's content-hash).
  bytes formation_event_hash = 1;

  // dissolved_at is the Unix-nanoseconds time at which dissolution
  // was recorded.
  int64 dissolved_at = 2;

  // reason is an operator-supplied free-form note. Optional;
  // strongly recommended — dissolution is the terminal lifecycle
  // operation on a hypothesis and the absence of a reason removes
  // the only record of the underlying judgment.
  string reason = 3;
}
