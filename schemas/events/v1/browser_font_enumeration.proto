// Sub-modality of BrowserObservation per §0151 discriminated-union
// framing. Carries installed-fonts enumeration fingerprint per the
// font-enumeration technique (well-documented anti-bot axis;
// installed font sets carry significant per-user entropy).
// Privacy-preserving design per §0146 + §0147: font_list_hash
// (BLAKE3) rather than raw font names list — installed fonts can
// reveal user-private information (corporate fonts, region-specific
// fonts), so the substrate carries only the hash.
//
// No `confidence` / `evidential_independence` fields — Cat I sub-
// modality payload, structurally excluded from paired-dimension
// per §2.6 BC3.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// BrowserFontEnumeration is the installed-fonts payload carried by
// BrowserObservation when the modality is `font_enumeration`.
message BrowserFontEnumeration {
  // font_list_hash is the BLAKE3-256 hash of the sorted ALPHA-
  // sorted list of installed font names. 32-byte fixed length.
  // Cross-observation correlation: two observations with the same
  // font_list_hash share the same installed font set.
  bytes font_list_hash = 1;

  // font_count is the count of installed fonts the producer
  // enumerated. Lower-entropy than font_list_hash but useful for
  // anti-bot signatures detecting unusual font count distributions
  // (e.g., headless browsers with minimal font installations). 0 =
  // not enumerated.
  uint32 font_count = 2;
}
