// Category III hypothesis lifecycle event per Charter §2.5 +
// decision-log §0066 (this entry — third-subtype dissolution
// landing; mirrors §0048 BC and §0059 AG).
//
// Per glossary + lifecycle-semantics.md line 36, dissolution is
// DISTINGUISHED from demotion: demotion withdraws OPERATIONAL USE;
// dissolution recognizes NON-EXISTENCE of the underlying phenomenon.
// The distinction transfers across all three subtypes.
//
// Per Charter §2.5 BC5, CampaignHypothesisDissolution is a Cat I
// record under §2.1.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// CampaignHypothesisDissolution records the recognition that a
// CampaignHypothesis no longer corresponds to any underlying
// phenomenon (e.g. recognition that the "campaign" claim was
// spurious — the events that grouped into a cohort had no
// coordinated thematic operation behind them).
message CampaignHypothesisDissolution {
  // formation_event_hash is the BLAKE3-256 content-hash of the
  // CampaignHypothesisFormation event identifying the hypothesis
  // being dissolved.
  bytes formation_event_hash = 1;

  // dissolved_at is the Unix-nanoseconds time at which dissolution
  // was recorded.
  int64 dissolved_at = 2;

  // reason is an operator-supplied free-form note. Optional;
  // strongly recommended (terminal lifecycle operation).
  string reason = 3;
}
