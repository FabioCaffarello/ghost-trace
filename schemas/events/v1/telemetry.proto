syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/libs/genproto/events/v1;eventsv1";

// PointerPoint is one vertex of a decimated pointer polyline.
// Wire form is [x, y, dt] per contract/architecture.md §2; dt_ms is
// milliseconds since the previous point in the same polyline.
message PointerPoint {
  int32 x = 1;
  int32 y = 2;
  uint32 dt_ms = 3;
}

// PointerEvent carries a decimated pointer polyline.
//
// Raw mousemove is several hundred events per second; the SDK decimates
// client-side and ships a polyline. M1 uses fixed-rate decimation at the
// server-driven collect.pointer_hz; the algorithm is a collect-policy
// field so it can change without an SDK release (contract §8.2).
message PointerEvent {
  // Milliseconds since session start. Never wall-clock — client
  // wall-clock is untrustworthy and leaks more than it gives (§2).
  uint32 t_ms = 1;

  // "mouse" | "trackpad" | "touch" | "pen". A normalization property,
  // not an identifier: trackpad and mouse produce structurally
  // different traces and must not be compared without it (§0). The
  // shipping SDK emits pointerType verbatim — "touch", "pen", else
  // "mouse" — so "trackpad" is reserved vocabulary: browsers do not
  // expose it, and claiming it would require inference downstream.
  string src = 2;

  repeated PointerPoint pts = 3;
}

// TelemetryBatch is one accepted envelope from the browser (§2).
//
// Stored as an immutable observation. Everything in it arrived from a
// hostile source and is treated as a claim, not a fact (§1 trust model).
message TelemetryBatch {
  string tenant_id = 1;

  // Server-side session identifier. Deliberately NOT the session_token:
  // the token is a bearer credential with a 30-minute life, and the
  // archive outlives it. The token maps to this id server-side.
  string session_id = 2;

  // Per-session monotonic batch counter. Gaps are meaningful (§2).
  uint32 seq = 3;

  // Client-claimed milliseconds since session start.
  uint32 sent_at_ms = 4;

  string page_path = 5;
  uint32 viewport_w = 6;
  uint32 viewport_h = 7;

  repeated PointerEvent pointer_events = 8;
  repeated KeyEvent key_events = 10;
  repeated ScrollEvent scroll_events = 11;
  repeated FocusEvent focus_events = 12;
  repeated VisibilityEvent visibility_events = 13;
  repeated FormEvent form_events = 14;

  // Server wall-clock nanoseconds at acceptance. Server-observed, so
  // unlike every other timestamp here it is trustworthy — which is what
  // makes network-arrival-vs-claimed-time checks possible later (§1).
  int64 received_at = 9;
}

// KeyEvent carries key TIMING and coarse class, never content (§2, §6).
//
// The class taxonomy preserves cadence and digraph structure while
// making reconstruction of typed text infeasible: knowing that six
// alphas were typed at particular intervals says a great deal about
// whether a human typed them and nothing about what they were.
message KeyEvent {
  uint32 t_ms = 1;

  // "down" | "up". Both are needed: dwell is down→up on one key and
  // flight is up→down between keys, and the two behave differently.
  string phase = 2;

  // "alpha" | "digit" | "nav" | "mod" | "whitespace" | "other".
  string key_class = 3;

  // Stable hash of the field identity. Never its value.
  string target = 4;
}

// ScrollEvent carries scroll displacement and input mode.
message ScrollEvent {
  uint32 t_ms = 1;
  int32 dy = 2;

  // "wheel" | "touch" | "key" | "programmatic". Programmatic scrolls
  // are a strong automation signal on their own — a person cannot
  // produce one. The shipping SDK emits only "wheel" and
  // "programmatic": it classifies by user-gesture presence, not input
  // device, so "touch" and "key" are reserved vocabulary until the
  // collector can tell them apart.
  string mode = 3;
}

// FocusEvent tracks focus and blur on identified fields.
//
// A form completed with no focus transitions at all was not completed
// by someone tabbing or clicking through it.
message FocusEvent {
  uint32 t_ms = 1;
  string state = 2; // "focus" | "blur"
  string target = 3;
}

// VisibilityEvent tracks page visibility.
message VisibilityEvent {
  uint32 t_ms = 1;
  string state = 2; // "visible" | "hidden"
}

// FormEvent records how a field came to hold its value, against a
// field identity. Field identity only, never content.
message FormEvent {
  uint32 t_ms = 1;
  string target = 2;

  // "paste" | "autofill" | "submit" | "injected".
  //
  // "injected" is the SDK's report that a field's value changed with no
  // preceding keydown on that field — page.fill, execute_script and
  // friends. It feeds FeatureState.injections, the policy's strongest
  // signal, so a client written from this schema that never emits it
  // produces sessions the best detector cannot see. This value was
  // live in the SDK before it was documented here; the enumeration in
  // this comment is the wire contract and must list every emitted
  // member. Known false-positive population: dictation, IME
  // composition, some assistive input (§6) — which is why the signal
  // is capped below categorical and cannot block alone.
  string action = 3;
}
