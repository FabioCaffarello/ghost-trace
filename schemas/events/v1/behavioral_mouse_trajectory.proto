// Sub-modality of BehavioralObservation per decision-log §0146
// discriminated-union framing. Carries cursor movement samples + click
// events extractable from browser-SDK / native instrumentation over a
// bounded observation window.
//
// No `confidence` / `evidential_independence` fields — Cat I sub-modality
// payload, structurally excluded from paired-dimension per §2.6 BC3.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// MouseSample is a single cursor-position sample at observation time.
// Per-sample time is recorded as offset_ns from the enclosing
// BehavioralObservation.observed_at — preserves per-sample resolution
// without redundant absolute-time storage. Pixel coordinates per the
// producer's reference frame (browser viewport or native window).
message MouseSample {
  // offset_ns is the per-sample time relative to the envelope's
  // observed_at, in nanoseconds. uint64 chosen to admit observation
  // windows longer than 9.2 seconds (int32 limit at ns granularity).
  uint64 offset_ns = 1;
  // x is the cursor x-coordinate (pixels) at the sample time.
  int32 x = 2;
  // y is the cursor y-coordinate (pixels) at the sample time.
  int32 y = 3;
}

// BehavioralMouseTrajectory is the cursor-movement payload carried by
// BehavioralObservation when the modality is `mouse_trajectory`.
message BehavioralMouseTrajectory {
  // samples are the cursor-position observations in chronological
  // order over the enclosing observation window. Empty when no
  // samples were observed.
  repeated MouseSample samples = 1;

  // click_count is the number of click events observed during the
  // window. Aggregated rather than per-event-recorded because click
  // sequences carry less inferential weight than trajectory shape for
  // anti-bot signature consumption; per-click ordering can be added
  // later as a separate sub-modality if F3 pressure surfaces.
  uint32 click_count = 2;

  // viewport_width / viewport_height are the producer's reference
  // viewport dimensions in pixels at observation time. Required for
  // downstream normalization of x/y coordinates across heterogeneous
  // device viewports. 0 = not observed.
  uint32 viewport_width = 3;
  uint32 viewport_height = 4;
}
