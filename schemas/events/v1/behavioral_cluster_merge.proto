// Category III hypothesis lifecycle event per Charter §2.5
// (Hypothesis Lifecycle Explicitness, frozen v0.3) +
// lifecycle-semantics.md §Hypothesis (Category III) line 28 — fifth
// of six lifecycle operations recorded as immutable discrete events.
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
//
// Constitutional shape per Charter §2.5 + lifecycle-semantics.md
// line 28: "Two hypotheses (same subtype or, per Q2-A.2 cross-subtype
// resolution at decision-log §0122-§0127, different subtypes) are
// recognized as describing the same underlying phenomenon and
// combined. Merge is recorded as an immutable event referencing
// both antecedents and the produced hypothesis."
//
// SCOPE — within-subtype only at this proto. Both antecedents and
// the produced hypothesis are BehavioralClusterFormation events.
// Cross-subtype merge (e.g. BehavioralCluster ⊕ CoordinationRing)
// is committee-resolved at decision-log §0122 (typing γ — per-pair
// canonical-merge typing) + §0125 + §0126 (pair-table 6/6 closed)
// + §0127 (Candidate β — separately-committed attachment record).
// Per §0127 structural commitment 3, existing target formation
// protos retain their current shape; the cross-subtype attachment
// surface lives in the separate CrossSubtypeMergeAttachment Cat I
// record, committed atomically with the merged formation via
// substrate.AppendPair. This proto therefore preserves its
// within-subtype shape unchanged.
//
// Structural choice (defended in decision-log §0049): the merge
// event references TWO antecedent formation hashes + ONE separately-
// committed produced formation hash, rather than collapsing the
// produced hypothesis identity into the merge event itself. This
// preserves the §0045 invariant — "hypothesis identity IS the
// formation event's content-hash" — so all lifecycle operations
// (promote, demote, dissolve, future merge/split) continue to
// reference hypotheses through formation hashes uniformly. The
// produced formation is a legitimate BehavioralClusterFormation
// recording the merged phenomenon claim; the merge event records
// the merge-specific provenance (which two prior formations were
// recognized as describing the same thing).
//
// Per §2.5 BC3 ("current state ... rather than as a projection over
// the operation event history" is forbidden), no denormalized
// "currently_merged" or "produced_subtype" field appears here — the
// projection layer reconstructs the chain of lifecycle events.
//
// Per §2.5 BC5 ("lifecycle events are Category I records under
// §2.5"), BehavioralClusterMerge is a Category I substrate row
// committed under §2.1 immutability.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// BehavioralClusterMerge records the recognition that two
// BehavioralCluster hypotheses describe the same underlying
// phenomenon, per Charter §2.5 + lifecycle-semantics.md line 28.
message BehavioralClusterMerge {
  // antecedent_formation_event_hashes is the set of BLAKE3-256
  // content-hashes of the BehavioralClusterFormation events
  // identifying the hypotheses being merged. Per §0045 hypothesis
  // identity IS the formation event's content-hash.
  //
  // Sorted ASCENDING (byte-lexicographic) for content-hash
  // stability — merging hypotheses A and B in either order MUST
  // produce a byte-identical merge event (the merge relation is
  // symmetric; substrate identity must not depend on call-order).
  //
  // Length MUST be exactly 2 (binary merge). Per decision-log §0127
  // structural commitment 3, cross-subtype merge is handled via the
  // CrossSubtypeMergeAttachment Cat I record, not via cardinality
  // expansion on this field. The repeated cardinality leaves room
  // for a future n-ary within-subtype merge extension without
  // breaking the wire shape; producers MUST validate length=2.
  repeated bytes antecedent_formation_event_hashes = 1;

  // produced_formation_event_hash is the BLAKE3-256 content-hash
  // of the BehavioralClusterFormation event recording the merged
  // phenomenon claim. This formation is a separately-committed
  // substrate row representing the produced hypothesis's identity
  // per §0045. Subsequent lifecycle operations (promotion,
  // demotion, dissolution) target THIS produced formation by hash,
  // not the merge event itself.
  //
  // The produced formation's source_event_hashes typically
  // includes the union of the antecedents' source_event_hashes;
  // its actor_refs typically includes the union of the
  // antecedents' actor_refs; its pattern_signature describes the
  // merged phenomenon. The substrate does NOT enforce these
  // structural-consistency relationships at this layer — they are
  // operational conventions of the inference process producing
  // the merge, surfaced via the merge event's reason field and
  // verifiable at projection time.
  bytes produced_formation_event_hash = 2;

  // merged_at is the Unix-nanoseconds time at which the merge
  // recognition was recorded. Typically wall-clock at the
  // operator's or inference process's decision; explicit values
  // permitted for forensic replay + deterministic re-derivation.
  int64 merged_at = 3;

  // reason is an operator-supplied free-form note explaining the
  // recognition that the two antecedent hypotheses describe the
  // same underlying phenomenon. Optional but strongly recommended
  // — the merge event encodes a substantive epistemic claim
  // (the two hypotheses were the same thing all along) and the
  // absence of a reason removes the only record of the underlying
  // judgment.
  string reason = 4;
}
