// Category III hypothesis lifecycle event per Charter §2.5 +
// lifecycle-semantics.md line 28 + decision-log §0074 (this entry —
// fourth-subtype merge landing; mirrors §0049 BC, §0060 AG, §0067
// CH).
//
// SCOPE — within-subtype only. Cross-subtype merge per
// entity-model.md §Cross-subtype operations remains deferred.
//
// Structural choice (mirrors §0049 Option B + §0060 + §0067): each
// antecedent + produced is a separately-committed
// CoordinationRingFormation. Preserves §0045+§0056+§0063+§0070
// hypothesis-identity invariant.
//
// The §0049 wire shape transfers cleanly to the interaction-centric
// (edge-list) subtype: the merge event records the merge-specific
// provenance (which two antecedent rings were combined); the
// produced CoordinationRingFormation typically carries the union of
// antecedents' interaction edges, but that's an operational
// convention of the inference process producing the merge — the
// merge event itself records only the antecedent + produced
// references.
//
// Per Charter §2.5 BC5, the merge event is a Cat I record under §2.1.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// CoordinationRingMerge records the recognition that two
// CoordinationRing hypotheses describe the same underlying
// coordinated-action phenomenon.
message CoordinationRingMerge {
  // antecedent_formation_event_hashes is the set of BLAKE3-256
  // content-hashes of the CoordinationRingFormation events being
  // merged. Sorted ASCENDING; cardinality MUST be exactly 2 at
  // this layer.
  repeated bytes antecedent_formation_event_hashes = 1;

  // produced_formation_event_hash is the BLAKE3-256 content-hash
  // of a separately-committed CoordinationRingFormation
  // representing the merged hypothesis.
  bytes produced_formation_event_hash = 2;

  // merged_at is the Unix-nanoseconds time at which the merge
  // recognition was recorded.
  int64 merged_at = 3;

  // reason is an operator-supplied free-form note. Optional but
  // strongly recommended.
  string reason = 4;
}
