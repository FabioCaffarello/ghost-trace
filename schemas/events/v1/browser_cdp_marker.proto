// Sub-modality of BrowserObservation per §0151 discriminated-union
// framing. Carries Chrome DevTools Protocol (CDP) automation-marker
// observation — detection of `navigator.webdriver` property, `$cdc_`
// runtime variables, and similar artifacts that distinguish
// automated browsers (Selenium / Puppeteer / Playwright) from
// human-operated browsers.
//
// Marker names are protocol-public (well-documented in anti-bot
// literature); committed as raw strings for substrate-side
// correlation across observations.
//
// No `confidence` / `evidential_independence` fields — Cat I sub-
// modality payload, structurally excluded from paired-dimension
// per §2.6 BC3.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// BrowserCDPMarker is the CDP-automation-marker payload carried by
// BrowserObservation when the modality is `cdp_marker`.
message BrowserCDPMarker {
  // markers_observed is the list of CDP / automation markers the
  // producer detected during the observation window. Examples:
  // "navigator.webdriver=true", "$cdc_asdjflasutopfhvcZLmcfl_",
  // "chrome.runtime undefined", "missing-chrome.csi". Producer-
  // defined enumeration; substrate treats as opaque strings.
  // Empty list = no markers detected.
  repeated string markers_observed = 1;

  // detection_count is the total count of marker detections during
  // the observation window. Aggregated across all markers; useful
  // for anti-bot signatures detecting high-density CDP-marker
  // surface.
  uint32 detection_count = 2;
}
