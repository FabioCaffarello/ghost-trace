// Category III hypothesis lifecycle event per Charter §2.5 +
// entity-model.md §Category III (`CampaignHypothesis` concrete
// subtype: "a set of events whose patterns suggest membership in
// a unified operation") + decision-log §0010 (Q2 subtype
// resolution) + decision-log §0063 (this entry — third Cat III
// concrete subtype formation landing; opens the third subtype
// lifecycle arc).
//
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
//
// Subtype distinction (per entity-model.md): the inference is over
// EVENTS, NOT actors. CampaignHypothesis is structurally distinct
// from BehavioralCluster (§0045, set of actors with shared
// operatorship) and AutomationGroup (§0056, set of actors matching
// an automation signature). The membership shape carries event
// content-hashes directly; no separate actor_refs field appears —
// the "campaign" inference is about the events themselves
// (timing, descriptor coherence, payload signatures) regardless
// of which actors produced them.
//
// Per Charter §2.5 BC5, CampaignHypothesisFormation is a Cat I
// record committed under §2.1 immutability.
//
// Hypothesis identity (per §0045 + §0056 invariant carried
// forward): the formation event's content-hash IS the
// CampaignHypothesis's stable identifier. Subsequent lifecycle
// events (promotion, demotion, merge, split, dissolution — all
// follow-on landings) reference the formation event's content-hash.
syntax = "proto3";

package ghosttrace.events.v1;

import "common/v1/evidential_independence.proto";

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// CampaignHypothesisFormation records the formation of a Category
// III CampaignHypothesis per entity-model.md: "a set of events
// whose patterns suggest membership in a unified operation".
//
// The inference that triggered formation is non-deterministic per
// Charter §2.2 (Category III). The recording is deterministic —
// given the same (substrate state, pattern_signature,
// pattern_parameters) tuple, the resulting
// CampaignHypothesisFormation content-hash is reproducible.
message CampaignHypothesisFormation {
  // pattern_signature is the stable identifier of the formation
  // pattern that produced this campaign (e.g.
  // "temporal-descriptor-cohort-v1"). Maps to entity-model.md
  // "thematic-coherence reference".
  string pattern_signature = 1;

  // pattern_parameters is the canonical-form string encoding of
  // the pattern's parameters (e.g.
  // "max_intra_event_gap_seconds=300;min_campaign_size=3"). Two
  // formations with logically-identical parameters MUST produce
  // byte-identical pattern_parameters strings.
  string pattern_parameters = 2;

  // formation_at is the Unix-nanoseconds time the inference
  // recognized the formation. Distinct from substrate's
  // committed_at. Typically derived deterministically as the max
  // event_time across the campaign's contributing events.
  int64 formation_at = 3;

  // confidence is a scalar in [0.0, 1.0] expressing the formation
  // pattern's confidence in the hypothesis. Paired with
  // evidential_independence (field 6) per Charter §2.6 (frozen v0.6
  // + patched v0.7.1 per decision-log §0137); canonical-serialization-
  // contract enforcement per decision-log §0136.
  float confidence = 4;

  // source_event_hashes is the set of Cat I observation
  // content-hashes that are members of this campaign per
  // entity-model.md "event membership representation". This field
  // serves DUAL purpose for CampaignHypothesis:
  //  - Membership: the events that compose the campaign.
  //  - Observational provenance per Charter §2.3 frozen v0.4.
  //
  // Sorted ASCENDING (byte-lexicographic) for content-hash
  // stability — two formations with identical event sets but
  // different ingestion orders MUST produce byte-identical
  // formation events.
  //
  // Note: CampaignHypothesis does NOT carry an actor_refs field —
  // the inference is event-centric. Operators that need actor
  // attribution recover it via the substrate's Cat I observation
  // payloads referenced here.
  repeated bytes source_event_hashes = 5;

  // evidential_independence is the paired dimension to confidence
  // (field 4) per Charter §2.6 (frozen v0.6 + patched v0.7.1 per
  // decision-log §0137). Computed per Q3-α (decision-log §0133):
  // ratio of Cat I roots NOT reachable via influenced_by from a
  // promoted hypothesis, divided by total Cat I roots in the
  // subject_ref_* chain. Rational-pair encoding per §0136.
  ghosttrace.common.v1.EvidentialIndependence evidential_independence = 6;

  // direct_influenced_by is the list of Cat III hypothesis content-
  // hashes that the producer directly declares as influencing this
  // formation per Charter §2.4 (frozen v0.5). 32-byte BLAKE3 hashes;
  // sorted ASCENDING per decision-log §0136 Influence Storage.
  repeated bytes direct_influenced_by = 7;

  // closure_hashes is the transitive closure of direct_influenced_by
  // per Q5-τ (decision-log §0134) + β-graph storage. Computed at
  // substrate write time per §0136 Influence Storage. 32-byte BLAKE3
  // hashes; sorted ASCENDING.
  repeated bytes closure_hashes = 8;
}
