// Category I primary observation per Charter §2.1 (Observational
// Integrity, frozen) + §2.2 (Epistemic Separation, frozen) +
// entity-model.md §Category I + decision-log §0127 (cross-subtype
// merge attachment-mechanism resolution: Candidate β separately-
// committed attachment record). Encoded under the canonical-
// serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
//
// CrossSubtypeMergeAttachment is the structural surface for the
// non-canonical-antecedent payload of a cross-subtype merge per
// §0125 + §0126 (pair-table) + §0127 (attachment mechanism). A
// cross-subtype merge produces a target formation under the per-
// cell canonical-merge typing γ (§0122) — e.g. {BC, AG} → AG. The
// non-canonical antecedent (BC, in Cell 1) carries surface content
// (operatorship signature) that does not survive into the target
// formation's native fields; the attachment record preserves it
// as a separately-committed Cat I record.
//
// Per §0127 atomic-pairing: the merge helper commits the merged
// formation + one or more CrossSubtypeMergeAttachment records via
// substrate.AppendPair (the §0104 OrphanCleanupAudit pattern).
// The pairing IS the structural commitment per Charter §4 (§1.3)
// falsifiability — a cross-subtype merge committed without paired
// attachment record(s) is structurally detectable via missing
// record(s) at substrate.
//
// Constitutional shape per §0127:
//   - This is a new Cat I record type. Existing target formation
//     protos (BehavioralClusterFormation, AutomationGroupFormation,
//     CoordinationRingFormation, CampaignHypothesisFormation)
//     retain their current shape; the attachment-record mechanism
//     is layered on top via substrate-level pairing, not via
//     per-target-proto evolution.
//   - Per §2.3 BC5 (frozen v0.4) multi-category-traversal, the
//     merged formation references the antecedent surface through
//     this attachment's antecedent_formation_hash field — the
//     attachment record IS a §2.3 BC5 provenance edge.
//   - Per §2.5 BC1 (frozen v0.3), the merged record remains the
//     lifecycle event; the attachment is a Cat I record paired
//     with it, not part of the lifecycle event's identity.
//
// Per-cell attachment requirements (per §0125 + §0126 + §0127):
//   - Cells 1 ({BC, AG} → AG), 2 ({BC, CR} → CR), 3 ({BC, CH} → CH):
//     attachment carries BC's pattern-signature reference under
//     surface_type = "operatorship_signature" (placeholder per
//     §0127 form-adopt + parameters-defer; final enum is follow-on
//     RFC).
//   - Cells 4 ({AG, CR} → CR), 5 ({AG, CH} → CH): attachment
//     carries AG's automation-signature under
//     surface_type = "automation_signature" (placeholder).
//   - Cell 6 ({CR, CH} → CH): derivation-vs-explicit-attachment
//     sub-question deferred per §0127 Open Questions.
//
// Sub-parameter deferrals per §0127 form-adopt + parameters-defer:
//   - surface_type enum values: committee-defended follow-on RFC.
//   - surface_payload canonicalization rule: byte-for-byte vs
//     re-canonicalized, follow-on RFC; affects §2.3 BC5
//     attachment-as-provenance-edge fidelity.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// CrossSubtypeMergeAttachment records the non-canonical-antecedent
// surface of a cross-subtype merge per decision-log §0127. Cat I
// substrate row committed atomically with the merged formation via
// substrate.AppendPair.
message CrossSubtypeMergeAttachment {
  // merged_formation_hash is the BLAKE3-256 content-hash of the
  // target formation produced by the cross-subtype merge per the
  // §0122 canonical-merge typing γ. The merge produces a single
  // target formation under one of the four concrete Cat III
  // subtypes; this attachment references it by content-hash.
  bytes merged_formation_hash = 1;

  // antecedent_formation_hash is the BLAKE3-256 content-hash of the
  // non-canonical-antecedent formation event whose surface this
  // attachment preserves. Per §0125 + §0126 per-cell resolution, the
  // canonical antecedent's structural content is absorbed into the
  // merged formation's native fields; the non-canonical antecedent's
  // surface requires explicit structural attachment per §0127.
  bytes antecedent_formation_hash = 2;

  // surface_type is the discriminator naming the antecedent's
  // structural surface attached here. Placeholder values established
  // at §0127 (form-adopt; specific enum values deferred):
  //   "operatorship_signature" — BC's pattern-signature reference
  //     (Cells 1, 2, 3 non-canonical-antecedent surface).
  //   "automation_signature" — AG's automation-signature
  //     (Cells 4, 5 non-canonical-antecedent surface).
  // Final committee-defended enumeration is follow-on RFC discipline
  // per §0127 sub-parameter deferral. Producers MUST use values
  // recognized by the consuming projection layer; the canonical-
  // serialization-contract enforces type at marshalling but not the
  // enum-value enumeration (that lives at the consumer).
  string surface_type = 3;

  // surface_payload is the canonicalized antecedent-surface payload.
  // Per §0127 form-adopt + parameters-defer, the canonicalization
  // rule (byte-for-byte from antecedent's original payload OR
  // re-canonicalized for the attachment shape) is a sub-parameter
  // deferred to follow-on RFC; the field carries the chosen-form
  // bytes either way. Producers MUST follow the consumer-layer
  // canonicalization rule once committee-fixed; the substrate
  // records the bytes as written.
  bytes surface_payload = 4;
}
