// Sub-modality of AttestationObservation per §0147 discriminated-
// union framing. Carries WebAuthn assertion (authentication
// ceremony) observation per W3C WebAuthn Level 2 specification.
// Distinct from FIDO2 attestation (registration ceremony) per
// AttestationFido2 sub-modality below.
//
// Privacy-preserving design: credential_id_hash (BLAKE3) rather
// than raw credential ID — credential IDs are stable per-authenticator
// identifiers that should not be committed in raw form to immutable
// substrate. authenticator_data + signature are load-bearing for
// verification: stored as raw bytes so substrate-side forensic
// re-verification is possible.
//
// No `confidence` / `evidential_independence` fields — Cat I sub-
// modality payload, structurally excluded from paired-dimension
// per §2.6 BC3.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// AttestationWebAuthnAssertion is the WebAuthn assertion payload
// carried by AttestationObservation when the modality is
// `webauthn_assertion`.
message AttestationWebAuthnAssertion {
  // credential_id_hash is the BLAKE3-256 hash of the WebAuthn
  // credential ID. 32-byte fixed length. Substrate-side cross-
  // observation correlation by credential_id is possible via
  // hash comparison without storing the raw credential ID.
  bytes credential_id_hash = 1;

  // authenticator_data is the raw authenticatorData bytes per
  // W3C WebAuthn §6.1. Load-bearing for assertion verification;
  // stored as bytes so substrate-side replay can re-verify.
  bytes authenticator_data = 2;

  // client_data_json_hash is the BLAKE3-256 hash of the
  // clientDataJSON bytes per W3C WebAuthn §5.10.1. 32-byte fixed
  // length. The clientDataJSON itself may contain producer-context
  // information (origin, challenge); hash form preserves the
  // verification anchor without committing the producer context.
  bytes client_data_json_hash = 3;

  // signature is the raw signature bytes produced by the
  // authenticator over (authenticator_data || sha256(clientDataJSON))
  // per W3C WebAuthn §6.3.3. Load-bearing for verification.
  bytes signature = 4;

  // user_handle_hash is the BLAKE3-256 hash of the userHandle field
  // (when present per W3C WebAuthn §6.3.3 step 5). 32-byte fixed
  // length. Empty when assertion was performed without userHandle.
  bytes user_handle_hash = 5;
}
