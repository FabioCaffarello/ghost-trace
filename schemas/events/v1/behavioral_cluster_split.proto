// Category III hypothesis lifecycle event per Charter §2.5
// (Hypothesis Lifecycle Explicitness, frozen v0.3) +
// lifecycle-semantics.md §Hypothesis (Category III) line 29 — sixth
// (and final) of six lifecycle operations recorded as immutable
// discrete events. Encoded under the canonical-serialization-contract
// at docs/architecture/canonical-serialization-contract.md.
//
// Constitutional shape per Charter §2.5 + lifecycle-semantics.md
// line 29: "A hypothesis is recognized as containing multiple
// distinct phenomena and is divided into multiple successor
// hypotheses. Recorded as an immutable event referencing the
// antecedent and each successor."
//
// SCOPE — within-subtype only at this proto. The antecedent and all
// successors are BehavioralClusterFormation events. Cross-subtype
// split (e.g. one hypothesis recognized as containing distinct
// BehavioralCluster + CoordinationRing phenomena) is committee-
// closed at the framing level via decision-log §0122-§0127 split-
// merge symmetric framing (typing γ' + enablement B' + D'
// symmetric); per §0127 structural commitment 3 the existing
// target formation protos are unchanged. Per-cell sub-parameters
// for cross-subtype split (the attachment-mechanism analog to
// §0127's CrossSubtypeMergeAttachment) remain follow-on RFC
// discipline — no committee-bound question at this layer, and this
// proto retains its within-subtype shape unchanged.
//
// Structural choice (defended in decision-log §0050): split is the
// structural inverse of merge per §0049. Each successor is a
// separately-committed BehavioralClusterFormation, mirroring the
// Option B per §0049 §Context for merge's produced hypothesis. This
// preserves the §0045 invariant — "hypothesis identity IS the
// formation event's content-hash" — so all six lifecycle operations
// (Promote, Demote, Dissolve, Merge antecedents, Merge produced,
// Split antecedent, Split successors) reference hypotheses through
// formation hashes uniformly.
//
// Per §2.5 BC3 ("current state ... rather than as a projection over
// the operation event history" is forbidden), no denormalized
// "currently_split" or "successor_count" field appears here — the
// projection layer reconstructs the chain of lifecycle events.
//
// Per §2.5 BC5 ("lifecycle events are Category I records under
// §2.5"), BehavioralClusterSplit is a Category I substrate row
// committed under §2.1 immutability.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// BehavioralClusterSplit records the recognition that a
// BehavioralCluster hypothesis contained multiple distinct
// phenomena and has been divided into multiple successor
// hypotheses, per Charter §2.5 + lifecycle-semantics.md line 29.
message BehavioralClusterSplit {
  // antecedent_formation_event_hash is the BLAKE3-256 content-hash
  // of the BehavioralClusterFormation event identifying the
  // hypothesis being split. Per §0045 hypothesis identity IS the
  // formation event's content-hash. Single antecedent (asymmetric
  // shape compared to merge's two-antecedent symmetry — split is
  // 1-to-N where merge is 2-to-1).
  bytes antecedent_formation_event_hash = 1;

  // successor_formation_event_hashes is the set of BLAKE3-256
  // content-hashes of the BehavioralClusterFormation events
  // representing the successor hypotheses produced by the split.
  // Each successor is a separately-committed substrate row
  // representing a distinct hypothesis's identity per §0045.
  // Subsequent lifecycle operations (promotion, demotion,
  // dissolution, merge, split) target individual successor
  // formations by hash, not the split event itself.
  //
  // Sorted ASCENDING (byte-lexicographic) for content-hash
  // stability — successors form a SET (the partition the
  // antecedent is divided into); substrate identity must not
  // depend on the order the producer enumerates the successors.
  //
  // At this layer cardinality MUST be ≥ 2 (per the canonical
  // definition "multiple successor hypotheses"). All entries MUST
  // be byte-distinct from each other AND from
  // antecedent_formation_event_hash (a split must produce strictly
  // distinct successors, none of which is identity-equal to the
  // antecedent — otherwise the operation is not a split).
  repeated bytes successor_formation_event_hashes = 2;

  // split_at is the Unix-nanoseconds time at which the split
  // recognition was recorded. Typically wall-clock at the
  // operator's or inference process's decision; explicit values
  // permitted for forensic replay + deterministic re-derivation.
  int64 split_at = 3;

  // reason is an operator-supplied free-form note explaining the
  // recognition that the antecedent hypothesis contained multiple
  // distinct phenomena. Optional but strongly recommended — split
  // encodes a substantive epistemic claim (the antecedent
  // hypothesis conflated multiple phenomena) and the absence of a
  // reason removes the only record of the underlying judgment.
  string reason = 4;
}
