// Category I primary observation per Charter §2.2 + decision-log §0015
// (Q1 resolution — declared-session as Cat I primary). Encoded under the
// canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// DeclaredSession is the producer-reported session-start observation.
message DeclaredSession {
  // declared_at is the producer-reported session-start time as Unix
  // nanoseconds since epoch. int64 chosen per decision-log §0024
  // modification 6 (canonical-form-load-bearing time fields use int64
  // Unix nanoseconds, not google.protobuf.Timestamp, for content-hash
  // stability).
  int64 declared_at = 1;

  // actor_ref is the single-tier actor identity reference per
  // decision-log §0023 (Q2 Identity tiers resolution — inception-phase
  // single-tier actor_ref adopted; multi-tier formalization deferred to
  // ordinary Ontology RFC discipline).
  string actor_ref = 2;

  // session_descriptor is an opaque producer-supplied session payload.
  // Format negotiated out-of-band; substrate treats as bytes.
  bytes session_descriptor = 3;
}
