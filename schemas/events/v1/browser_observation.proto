// Category I primary observation per Charter §2.1 + §2.2 +
// entity-model.md §Category I. BrowserObservation is the typed
// Cat I observation for browser fingerprinting surface (canvas,
// WebGL, font enumeration, CDP automation markers, HTTP header
// ordering). Fourth and final F1 modality per Domain Pack v0.1
// §0143; established by §0151.
//
// Discriminated-union pattern inherited from §0144 + §0146 + §0147
// (Methodological observation 1 across 3 consecutive F1 modality
// landings: pattern cascades cleanly). Five sub-modalities, one per
// fingerprinting surface: canvas_fingerprint, webgl_fingerprint,
// font_enumeration, cdp_marker, header_order. Per §0146
// Methodological observation 2 (sub-modality count is structural
// choice): 5 is justified by 5 structurally-distinct browser
// fingerprinting axes documented in the anti-bot literature.
//
// Inherits authentication_class envelope field natively per §0150
// resolution — BrowserObservation lands AFTER §0150 closed the F4
// OMQ, so retrofit is avoided per §0147 Methodological observation
// 1 (resolution-before-fourth-modality-landing). Producer typically
// emits CLIENT_WITNESSED (browser SDK position).
//
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md. Per §0151
// constitutional review: BrowserObservation declares NEITHER
// `confidence` NOR `evidential_independence` fields — structurally
// excluded from the validatePairedDimensionCommitment subject set
// per §2.6 BC3.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

import "common/v1/authentication_class.proto";
import "events/v1/browser_canvas_fingerprint.proto";
import "events/v1/browser_webgl_fingerprint.proto";
import "events/v1/browser_font_enumeration.proto";
import "events/v1/browser_cdp_marker.proto";
import "events/v1/browser_header_order.proto";

// BrowserObservation is a typed Cat I primary observation about a
// browser-level fingerprinting surface. Each instance carries exactly
// one of the five sub-modality payloads via the `modality` oneof; the
// envelope carries the invariant fields (observation time, actor
// attribution, optional session context, collector provenance,
// authentication-class per §0150).
message BrowserObservation {
  // observed_at is the collector-reported observation time as Unix
  // nanoseconds since epoch. int64 per decision-log §0024 mod 6.
  int64 observed_at = 1;

  // actor_ref is the single-tier actor identity reference per
  // decision-log §0023. Optional: empty string = unattributed.
  string actor_ref = 2;

  // session_ref is the optional producer-supplied session-context
  // identifier per §0146 (d) (parallel to actor_ref shape; NOT a
  // substrate-verifiable BLAKE3 reference). Empty string = no
  // session context.
  string session_ref = 3;

  // collector_ref identifies the adapter / ingestion-source per
  // §0144 (e) phenomenon-vs-record reconciliation slot. Typical
  // BrowserObservation collectors: "browser-sdk:v1",
  // "synthetic-browser-gen:v0", "honeypot-browser-collector:hp-01".
  string collector_ref = 4;

  // modality discriminates which sub-modality payload is carried.
  // Exactly one of the five sub-modality messages is populated per
  // observation; mutual exclusivity enforced by proto3 oneof at the
  // marshalling boundary.
  oneof modality {
    BrowserCanvasFingerprint canvas_fingerprint = 5;
    BrowserWebGLFingerprint webgl_fingerprint = 6;
    BrowserFontEnumeration font_enumeration = 7;
    BrowserCDPMarker cdp_marker = 8;
    BrowserHeaderOrder header_order = 9;
  }

  // authentication_class records the verification channel per §0150.
  // BrowserObservation natively inherits this field at landing time;
  // producer typically emits CLIENT_WITNESSED (browser SDK position
  // without cryptographic anchor for the actor identity claim). Field
  // at position 10 preserves cross-modality envelope symmetry per
  // §0150 placement convention.
  ghosttrace.common.v1.AuthenticationClass authentication_class = 10;
}
