// Category I primary observation per Charter §2.1 + §2.2 +
// entity-model.md §Category I. NetworkObservation is the typed
// successor to the legacy opaque NetworkEvent (network_event.proto),
// introduced by F1 of the Domain Pack v0.1 anti-bot atlas per
// decision-log §0143 + §0144. Discriminated union (oneof) over five
// sub-modalities — tcp_fingerprint, tls_ja4, http2_frame_pattern,
// dns_pattern, ip_asn — selected per §0144 (a) constitutional framing:
// strong typing pressures F3 signature engines to name explicitly which
// sub-modalities each signature consumes, which is part of the epistemic
// yield of the "comprovar" posture cravada in Domain Pack v0.1.
//
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md. Per §0144
// constitutional review: NetworkObservation declares NEITHER `confidence`
// NOR `evidential_independence` fields — structurally excluded from the
// validatePairedDimensionCommitment subject set per §2.6 BC3 (paired-
// dimension applies to Cat II / Cat III only; Cat I observation records
// carry no inferential commitment).
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

import "events/v1/network_tcp_fingerprint.proto";
import "events/v1/network_tls_ja4.proto";
import "events/v1/network_http2_frame_pattern.proto";
import "events/v1/network_dns_pattern.proto";
import "events/v1/network_ip_asn.proto";

// NetworkObservation is a typed Cat I primary observation about a
// network-layer phenomenon. Each instance carries exactly one of the
// five sub-modality payloads via the `modality` oneof; the envelope
// carries the invariant fields (observation time, actor attribution,
// endpoint reference, collector provenance).
message NetworkObservation {
  // observed_at is the collector-reported observation time as Unix
  // nanoseconds since epoch. int64 chosen per decision-log §0024
  // modification 6 (canonical-form-load-bearing time fields use int64
  // Unix nanoseconds, not google.protobuf.Timestamp, for content-hash
  // stability). Parallel to NetworkEvent.observed_at.
  int64 observed_at = 1;

  // actor_ref is the single-tier actor identity reference per
  // decision-log §0023 (Q2 Identity tiers resolution — inception-phase
  // single-tier actor_ref adopted; multi-tier formalization deferred to
  // ordinary Ontology RFC discipline). Optional: empty string =
  // unattributed observation.
  string actor_ref = 2;

  // endpoint_ref is the network endpoint the observation pertains to,
  // in opaque string form (e.g. "ip:port", "subnet/mask", or a
  // collector-specific endpoint identifier). Format negotiated
  // out-of-band; substrate treats as bytes-equivalent string. Optional.
  string endpoint_ref = 3;

  // collector_ref identifies the adapter / ingestion-source that
  // produced this record (e.g. "cic-ids-2017-adapter:v1",
  // "honeypot-collector:hp-01", "synthetic-generator:v0-batch-7").
  // Per decision-log §0144 (e): introduced as the structural seed for
  // the phenomenon-vs-record reconciliation OMQ anticipated by §0143;
  // the OMQ opens formally for committee resolution when F1 has two
  // ingestion sources stable (per §0143 trigger). collector_ref does
  // not modify the substrate-immutability semantics of §2.1; it is a
  // provenance field recording origin of the record itself, not a
  // reference to a derived assertion.
  string collector_ref = 4;

  // modality discriminates which sub-modality payload is carried.
  // Exactly one of the five sub-modality messages is populated per
  // observation; mutual exclusivity is enforced by the proto3 oneof
  // discipline at the marshalling boundary.
  oneof modality {
    NetworkTcpFingerprint tcp_fingerprint = 5;
    NetworkTlsJa4 tls_ja4 = 6;
    NetworkHttp2FramePattern http2_frame_pattern = 7;
    NetworkDnsPattern dns_pattern = 8;
    NetworkIpAsn ip_asn = 9;
  }
}
