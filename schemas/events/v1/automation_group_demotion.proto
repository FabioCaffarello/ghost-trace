// Category III hypothesis lifecycle event per Charter §2.5 +
// decision-log §0011 (Q4 staged-combination Layer A AND Layer B) +
// §0058 (this entry — second-subtype demotion landing; mirrors
// §0047 for the AutomationGroup concrete subtype) + §0135 (Layer B
// L-BC-OR) + §0136 (canonical-serialization-contract operational
// discharge; predicate firing values recorded for audit) + §0138
// (Layer B parameter-calibration).
//
// Constitutional shape per Charter §2.5: demotion ends the
// operational use of a SPECIFIC promotion event. Same two-hop chain
// reconstruction as §0047:
//   demotion.promotion_event_hash → AutomationGroupPromotion record
//   promotion.formation_event_hash → AutomationGroupFormation record
//     (hypothesis identity per §0045 + §0056)
// Per §2.5 BC3, no denormalized formation_event_hash field.
//
// Per §2.5 BC5, AutomationGroupDemotion is a Category I record
// committed under §2.1 immutability.
//
// Cadence-gate + predicate-firing semantics per §0011 + §0135 +
// §0136: Layer A (cadence gate) is the outer-AND gate; Layer B's
// L-BC-OR predicate is the inner disjunction. When the predicate
// fires, the operator commits this demotion event recording the
// firing values for audit. Operator-override demotions leave the
// firing-value fields unset.
syntax = "proto3";

package ghosttrace.events.v1;

import "common/v1/evidential_independence.proto";

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// AutomationGroupDemotion records the transition of an
// AutomationGroup hypothesis OUT of operational use as enrichment
// context.
message AutomationGroupDemotion {
  // promotion_event_hash is the BLAKE3-256 content-hash of the
  // AutomationGroupPromotion event being ended.
  bytes promotion_event_hash = 1;

  // demoted_at is the Unix-nanoseconds time at which demotion was
  // recorded. Cadence-gate state computed at consumer time as
  // (demoted_at - promotion.promoted_at) >=
  // promotion.layer_b_parameters.n_a_duration_nanoseconds
  // (or promotion.cadence_seconds * 1e9 for pre-§0138 promotions).
  int64 demoted_at = 2;

  // reason is an operator-supplied free-form note. Optional;
  // discouraged at audit time for operator-override demotions
  // (within-cadence-window or non-predicate-fired).
  string reason = 3;

  // freshness_b_at_firing is the value of freshness_B(H) at the
  // moment the L-BC-OR predicate fired per §0135 + §0136. Rational-
  // pair encoding per §0136. Set when triggered by predicate firing;
  // unset for operator-override demotions. Projection-replay
  // validates (freshness_b_at_firing < promotion.layer_b_parameters
  // .t_b) against the L-BC-OR B-branch firing condition.
  ghosttrace.common.v1.EvidentialIndependence freshness_b_at_firing = 4;

  // saturation_c_at_firing is the value of saturation_C(H) at the
  // moment the L-BC-OR predicate fired per §0135 + §0136. Rational-
  // pair encoding; L-C structural-exclusion applied per §0135. Set
  // when triggered by predicate firing; unset for operator-override
  // demotions. Projection-replay validates (saturation_c_at_firing
  // > promotion.layer_b_parameters.k_c) against the C-branch firing
  // condition. Both fields may be set simultaneously under L-BC-OR.
  ghosttrace.common.v1.EvidentialIndependence saturation_c_at_firing = 5;
}
