// Category III hypothesis lifecycle event per Charter §2.5 +
// lifecycle-semantics.md line 29 + decision-log §0068 (this entry —
// SIXTH (final) lifecycle operation of the third Cat III subtype
// arc; mirrors §0050 BC and §0061 AG; closes the CampaignHypothesis
// lifecycle surface).
//
// SCOPE — within-subtype only. Cross-subtype split per
// entity-model.md §Cross-subtype operations remains deferred.
//
// Structural choice (mirrors §0050 + §0049 Option B): each
// successor is a separately-committed CampaignHypothesisFormation.
// Preserves §0045+§0056+§0063 hypothesis-identity invariant.
//
// Per the §0067 resolution, the event-centric subtype distinction
// lives in the FORMATION shape, not the split event. The §0050
// wire shape transfers cleanly.
//
// Per §2.5 BC3, no denormalized state field. Per §2.5 BC5, the
// split event is a Cat I record under §2.1.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// CampaignHypothesisSplit records the recognition that a
// CampaignHypothesis contained multiple distinct operations and
// has been divided into successor hypotheses.
message CampaignHypothesisSplit {
  // antecedent_formation_event_hash is the BLAKE3-256 content-
  // hash of the CampaignHypothesisFormation being split. Single
  // antecedent (1-to-N shape, asymmetric vs merge's 2-to-1).
  bytes antecedent_formation_event_hash = 1;

  // successor_formation_event_hashes is the set of BLAKE3-256
  // content-hashes of the CampaignHypothesisFormation events
  // representing the successor hypotheses. Sorted ASCENDING;
  // cardinality MUST be >= 2; all entries MUST be byte-distinct
  // from each other AND from antecedent_formation_event_hash.
  repeated bytes successor_formation_event_hashes = 2;

  // split_at is the Unix-nanoseconds time at which the split
  // recognition was recorded.
  int64 split_at = 3;

  // reason is an operator-supplied free-form note. Optional but
  // strongly recommended.
  string reason = 4;
}
