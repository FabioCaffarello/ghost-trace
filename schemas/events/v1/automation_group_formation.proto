// Category III hypothesis lifecycle event per Charter §2.5
// (Hypothesis Lifecycle Explicitness, frozen v0.3) +
// entity-model.md §Category III (`AutomationGroup` concrete subtype:
// "a set of actors whose behavioral patterns match a signature of
// automated (non-human) operation") + decision-log §0010 (Q2 subtype
// resolution) + decision-log §0056 (this entry — first
// AutomationGroup formation landing; opens the second concrete Cat
// III subtype lifecycle arc).
//
// Encoded under the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
//
// Constitutional shape per Charter §2.5 Boundary Condition 5:
// "Chains crossing Category III continue to the hypothesis's
// lifecycle events, which are Category I records under §2.5."
// AutomationGroupFormation is therefore a Category I record committed
// under §2.1 immutability — the formation event IS the substrate-
// level fact, while the AutomationGroup's current state is a
// projection over its lifecycle event chain (§2.5 BC3 + §0051).
//
// Hypothesis identity: per Charter §2.3 (frozen v0.4) + decision-log
// §0045 + §0056, the AutomationGroup's stable identifier is the
// content-hash of THIS formation event. The same hypothesis-identity
// invariant established for BehavioralCluster (per §0045) applies to
// AutomationGroup: subsequent lifecycle events (promotion, demotion,
// merge, split, dissolution — follow-on landings) reference the
// formation event's content-hash to identify the hypothesis they
// operate on.
//
// Subtype distinction (per entity-model.md): the inference is about
// the operation's CHARACTER (automated, non-human), NOT about shared
// operatorship (which is the BehavioralCluster inference per §0045).
// Two actors can be members of the same AutomationGroup without
// sharing an operator — they share an automation SIGNATURE
// (mechanical cadence, deterministic timing, etc.).
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// AutomationGroupFormation records the formation of a Category III
// AutomationGroup hypothesis per entity-model.md "a set of actors
// whose behavioral patterns match a signature of automated (non-
// human) operation".
//
// The inference that triggered formation is non-deterministic per
// Charter §2.2 (Category III: "probabilistic constructions"). The
// recording of the formation event is deterministic — given the
// same (substrate state, pattern_signature, pattern_parameters)
// tuple, the resulting AutomationGroupFormation content-hash is
// reproducible.
message AutomationGroupFormation {
  // pattern_signature is the stable identifier of the formation
  // pattern that produced this AutomationGroup (e.g.
  // "uniform-cadence-v1"). Maps to entity-model.md "signature
  // reference". Part of the formation event's content-hash → part
  // of the hypothesis's identity.
  string pattern_signature = 1;

  // pattern_parameters is the canonical-form string encoding of the
  // pattern's parameters (e.g.
  // "max_cov_threshold=0.15;min_observation_count=5"). Canonical
  // form: lowercase key=value pairs sorted by key, separated by
  // semicolons. Two formations with logically-identical parameters
  // MUST produce byte-identical pattern_parameters strings.
  string pattern_parameters = 2;

  // actor_refs is the set of actor identity references identifying
  // the automation-group members per entity-model.md "set of actors".
  // Sorted ASCENDING for content-hash stability — two formations with
  // identical member sets but different ingestion orders MUST produce
  // byte-identical formation events. Each actor_ref is single-tier
  // per decision-log §0023.
  repeated string actor_refs = 3;

  // formation_at is the Unix-nanoseconds time the inference
  // recognized the formation. Distinct from substrate's committed_at
  // and from any source observation's event_time. Per the §0045
  // determinism contract carried forward to §0056, the value is
  // derived deterministically from the inputs (typically the latest
  // contributing observation's event_time), NOT from wall-clock at
  // recording time.
  int64 formation_at = 4;

  // confidence is a scalar in [0.0, 1.0] expressing the formation
  // pattern's confidence in the hypothesis. PLACEHOLDER pending
  // Charter §2.6 (Evidential Independence Integrity) redaction —
  // §2.6 will introduce the paired evidential_independence dimension.
  // Until then this scalar is computed deterministically by each
  // formation pattern (no semantic interpretation beyond ordering).
  float confidence = 5;

  // source_event_hashes is the set of Category I observation
  // content-hashes from which the formation was inferred —
  // observational provenance per Charter §2.3 (Provenance Integrity,
  // frozen v0.4). Each hash is the BLAKE3-256 of a DeclaredSession
  // (or other Cat I primary) that contributed to the formation
  // decision. Sorted ASCENDING for content-hash stability.
  repeated bytes source_event_hashes = 6;
}
