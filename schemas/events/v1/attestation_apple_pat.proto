// Sub-modality of AttestationObservation per §0147 discriminated-
// union framing. Carries Apple Private Access Token redemption
// observation. Per IETF Privacy Pass Architecture (draft-ietf-
// privacypass-architecture) + Apple Private Access Tokens
// documentation.
//
// Privacy-preserving design: token_hash (BLAKE3) rather than raw
// token bytes — preserves forensic verifiability (operator may
// retain raw token out-of-band and verify via re-hash) without
// committing the redeemable token to immutable substrate. Per
// §0146 Methodological observation 3 (privacy-preserving Cat I
// discipline).
//
// No `confidence` / `evidential_independence` fields — Cat I sub-
// modality payload, structurally excluded from paired-dimension
// per §2.6 BC3.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// AttestationApplePAT is the Apple Private Access Token redemption
// payload carried by AttestationObservation when the modality is
// `apple_pat`.
message AttestationApplePAT {
  // token_hash is the BLAKE3-256 hash of the redeemed token bytes.
  // 32-byte fixed length. Producer may retain raw token out-of-band
  // for re-verification; substrate stores only the hash.
  bytes token_hash = 1;

  // issuer_key_id is the Apple issuer-key identifier (string form
  // per Apple PAT documentation). Identifies which Apple issuer key
  // signed the underlying Privacy Pass token.
  string issuer_key_id = 2;

  // challenge_hash is the BLAKE3-256 hash of the challenge bytes
  // that produced this token. 32-byte fixed length. Empty when
  // challenge bytes were not preserved by the producer.
  bytes challenge_hash = 3;

  // redeemed_at is the producer-reported token-redemption time as
  // Unix nanoseconds. May differ from envelope observed_at when the
  // producer batches observations.
  int64 redeemed_at = 4;
}
