// Category III hypothesis lifecycle event per Charter §2.5
// (Hypothesis Lifecycle Explicitness, frozen v0.3) + decision-log
// §0011 (Q4 resolution — staged-combination criterion for demotion-
// candidacy: Layer A cadence + Layer B deep criterion; Layer A
// parameter is MANDATORY on every promotion event). Encoded under
// the canonical-serialization-contract at
// docs/architecture/canonical-serialization-contract.md.
//
// Constitutional shape per Charter §2.5 Structural Requirement:
// "Promotion events carry the structural parameters governing the
// promoted hypothesis's subsequent demotion-candidacy." This entry
// satisfies that requirement by recording cadence_seconds (Layer A)
// on every promotion. Layer B (the deep criterion on evidential
// independence per §2.6) remains deferred until §2.6 redacts.
//
// Per Charter §2.5 BC5 ("Chains crossing Category III continue to
// the hypothesis's lifecycle events, which are Category I records
// under §2.5"), BehavioralClusterPromotion is a Category I record
// committed under §2.1 immutability.
//
// The promoted hypothesis is identified by formation_event_hash —
// the content-hash of the originating BehavioralClusterFormation
// event (per decision-log §0045 — hypothesis identity IS the
// formation event's content-hash).
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// BehavioralClusterPromotion records the transition of a
// BehavioralCluster hypothesis from active inference to operational
// use as enrichment context, per Charter §1 + entity-model.md
// §Category III + decision-log §0011 (promotion mechanism).
message BehavioralClusterPromotion {
  // formation_event_hash is the BLAKE3-256 content-hash of the
  // originating BehavioralClusterFormation event. Identifies the
  // hypothesis being promoted. Per decision-log §0045, the
  // hypothesis's stable identifier IS the formation event's
  // content-hash; promotion references that hash directly.
  bytes formation_event_hash = 1;

  // promoted_at is the Unix-nanoseconds time from which the Layer A
  // cadence gate is measured. Per decision-log §0011, the cadence
  // gate opens demotion-candidacy when elapsed time since promoted_at
  // exceeds cadence_seconds. Typically wall-clock at the operator's
  // promotion decision; explicit values permitted for forensic
  // replay + deterministic re-derivation.
  int64 promoted_at = 2;

  // cadence_seconds is the Layer A parameter per decision-log §0011
  // staged-combination criterion: elapsed time since promoted_at
  // that opens demotion-candidacy. MANDATORY per Charter §2.5
  // Structural Requirement. Layer B (deep criterion on evidential
  // independence) remains deferred until §2.6 operationalization.
  int64 cadence_seconds = 3;

  // reason is an operator-supplied free-form note explaining why
  // the hypothesis was promoted. Optional; recorded for forensic
  // replay. Empty is acceptable but discouraged at audit time.
  string reason = 4;
}
