// Category I primary observation per Charter §2.2 + decision-log §0038.
// Records the system's observation of the act of ingesting a paired
// primary observation: who delivered it (client identity from a verified
// mTLS cert chain, when available), over what channel, and when the
// service committed. The paired-by-reference shape per Charter §2.1
// Boundary Conditions ("enrichment paired with observations as a
// separate stream of immutable events; not a mutation") + §0037
// follow-on "Client identity → ingestion provenance."
//
// IngestionEvent is committed atomically alongside the primary
// observation per substrate.Substrate.AppendPair. Each IngestionEvent
// references exactly one primary observation by its content-hash; the
// reverse direction (primary → ingestion) is recovered by index lookup
// at read time.
syntax = "proto3";

package ghosttrace.events.v1;

option go_package = "github.com/FabioCaffarello/ghost-trace/services/ingestion/internal/genproto/events/v1;eventsv1";

// IngestionEvent is the system's observation of an ingestion act.
message IngestionEvent {
  // primary_event_hash is the BLAKE3-256 content hash of the paired
  // primary observation. The pairing is one-to-one: each
  // IngestionEvent references exactly one primary observation; each
  // primary observation has at most one paired IngestionEvent
  // (replays via idempotent commit do not duplicate).
  bytes primary_event_hash = 1;

  // received_at is the Unix-nanoseconds time the service FIRST
  // received the primary observation. Distinct from substrate's
  // committed_at (which is set when the SQL row is inserted) and
  // from the producer's declared_at (which is on the primary
  // observation itself).
  int64 received_at = 2;

  // ingested_at is the Unix-nanoseconds time the service committed
  // the primary observation to the substrate. May equal received_at
  // when the substrate-write path is fast.
  int64 ingested_at = 3;

  // channel is the wire channel that delivered the primary
  // observation. Inception-phase values: "stdin", "http", "https",
  // "https+mtls". Additional channels (gRPC) registered as introduced.
  string channel = 4;

  // client_common_name is the verified peer certificate's Subject
  // Common Name when delivered over mTLS. Empty when no mTLS
  // (stdin, plain http, plain https without client cert verification).
  string client_common_name = 5;

  // client_subject_alt_names are the SAN entries from the verified
  // peer certificate (DNS names + URI SANs + email SANs, in the
  // order returned by the TLS library). Empty when no mTLS.
  repeated string client_subject_alt_names = 6;

  // client_cert_sha256 is the lowercase-hex SHA-256 digest of the
  // verified peer certificate's DER encoding. Stable per-cert
  // identifier independent of the CN; survives CN reuse across
  // rotated certs. Empty when no mTLS.
  string client_cert_sha256 = 7;
}
